// The BAFL-native band: who rosters this player right now, in the season being viewed.
function pcOwnerBandHTML(pid) {
  const own = ownerOf(pid);
  if (!own) {
    return `<div class="pc-owner pc-owner-fa"><span class="pc-owner-lbl">BAFL</span>
      <span class="pc-owner-name">Free agent</span></div>`;
  }
  return `<div class="pc-owner"><span class="pc-owner-lbl">BAFL</span>
    <span class="pc-owner-name team-link" onclick="closePlayerCard();openRosterModal(${own.rid})">${esc(own.name)}</span></div>`;
}

// The draft banner is independent of which season or source tab is showing, so it must NOT be
// gated on pcToken — that counter is bumped by every season load, and since openPlayerCard
// starts this lookup and then immediately selects a season, a token check here would discard
// the result every single time. The only thing that matters is that the same player is still
// on screen when it lands.
async function loadPcDraft(pid) {
  const p = playerRec(pid);
  const aid = await resolveEspnAthleteId(pid, p && p.name, 'nfl');
  if (!aid || !PC || PC.pid !== pid) return;
  const info = await fetchEspnDraftInfo(aid);
  const el = document.getElementById('pcHeroDraft');
  if (el && PC && PC.pid === pid) el.innerHTML = espnDraftHero(info);
}

// ─── Mode tabs (NFL / College) ────────────────────────────────────────────
function renderPcModeTabs() {
  const el = document.getElementById('pcTabs');
  if (!el || !PC) return;
  const tab = (mode, label) =>
    `<button class="pc-tab ${PC.mode === mode ? 'active' : ''}" onclick="setPcMode('${mode}')">${label}</button>`;
  el.innerHTML = tab('nfl', 'NFL') + tab('college', 'College');
}
function setPcMode(mode) {
  if (!PC || PC.mode === mode) return;
  PC.mode = mode;
  renderPcModeTabs();
  renderPcSeasonTabs();
  if (mode === 'college') loadPcCollege();
  else if (PC.espnOnly) loadPcEspn('nfl');
  else pcSelectSeason(PC.season || PC.seasons[0], { autoAdvance: true });
}

// ─── Season tabs ──────────────────────────────────────────────────────────
// The pills are the heart of the seedless design. They render immediately from the derived
// candidate list, and each one is an independent lazy load. A season proven empty is disabled
// rather than removed, so the row doesn't reflow under the user's finger mid-tap.
function renderPcSeasonTabs() {
  const el = document.getElementById('pcSeasons');
  if (!el || !PC) return;
  // ESPN-sourced views carry their own season list inside the payload, so the derived pills
  // don't apply — hide them rather than show a row that controls nothing.
  if (PC.mode === 'college' || PC.espnOnly) { el.innerHTML = ''; return; }
  if (!PC.seasons.length) { el.innerHTML = ''; return; }
  el.innerHTML = PC.seasons.map(s => {
    const st = PC.seasonState[s] || 'unknown';
    const cls = ['pc-season-pill'];
    if (PC.season === s) cls.push('active');
    if (st === 'empty') cls.push('empty');
    if (st === 'loading') cls.push('loading');
    const title = st === 'empty' ? 'No games recorded this season' : `View ${s} game log`;
    return `<button class="${cls.join(' ')}" title="${escAttr(title)}"
      ${st === 'empty' ? 'disabled' : ''} onclick="pcSelectSeason('${s}')">${s}</button>`;
  }).join('');
}

// Load and show one season. `autoAdvance` walks down to the next season with data — needed
// because in the offseason (and for anyone who missed a year) the newest candidate season is
// legitimately empty for everybody.
async function pcSelectSeason(season, opts) {
  if (!PC || !season) return;
  opts = opts || {};
  const pid = PC.pid;
  const tok = ++pcToken;
  PC.season = String(season);
  PC.seasonState[PC.season] = PC.seasonState[PC.season] === 'ok' ? 'ok' : 'loading';
  renderPcSeasonTabs();
  const body = document.getElementById('pcBody');
  if (body) body.innerHTML = `<div class="pc-loading">Loading ${esc(season)} game log…</div>`;

  let weekly;
  try {
    weekly = await fetchPlayerWeekly(pid, PC.season);
  } catch {
    if (tok !== pcToken || !PC) return;
    PC.seasonState[PC.season] = 'unknown';
    renderPcSeasonTabs();
    if (body) body.innerHTML = pcRetryHTML("Couldn't load that season. Check your connection.");
    return;
  }
  if (tok !== pcToken || !PC || PC.pid !== pid) return;

  const rows = pcSeasonRows(weekly);
  if (!rows.length) {
    PC.seasonState[PC.season] = 'empty';
    // Walk to the next-newest candidate with data, but bound the search — a genuinely
    // seasonless player shouldn't trigger a cascade of requests.
    const idx = PC.seasons.indexOf(PC.season);
    const next = opts.autoAdvance
      ? PC.seasons.slice(idx + 1, idx + 4).find(s => PC.seasonState[s] !== 'empty')
      : null;
    renderPcSeasonTabs();
    if (next) return pcSelectSeason(next, { autoAdvance: true });
    if (body) body.innerHTML = `<div class="pc-empty">No ${esc(PC.season)} game log for this player.</div>`;
    return;
  }
  PC.seasonState[PC.season] = 'ok';
  renderPcSeasonTabs();
  if (body) {
    body.innerHTML = renderPcSeason(PC.season, rows, PC.pos) +
      `<div class="pc-src">Per-game stats via Sleeper · category values use BAFL scoring.</div>`;
    applyConsistencyBadge(PC.season, rows, PC.pos);
  }
}

function pcRetryHTML(msg) {
  return `<div class="pc-loading pc-retry-wrap"><span>${esc(msg)}</span>
    <button class="pc-retry-btn" onclick="pcSelectSeason(PC && PC.season)">Retry</button></div>`;
}

// One player-season of weekly stats, cached. This is the only network call the NFL tab makes.
async function fetchPlayerWeekly(pid, season) {
  const key = `${season}:${pid}`;
  if (S.weeklyCache[key]) return S.weeklyCache[key];
  const data = await fetchJ(SLEEPER_WEEKLY_URL(pid, season));
  S.weeklyCache[key] = data || {};
  return S.weeklyCache[key];
}

// ─── Row building ─────────────────────────────────────────────────────────
// Sleeper's weekly payload is {week: {stats, opponent, team, ...}} with nulls for weeks the
// player wasn't on a roster. A week with gp===0 and no opponent is a bye; a week with an
// opponent but gp===0 is an inactive/DNP, which is a different thing and reads differently.
function pcSeasonRows(weekly) {
  const rows = [];
  for (const wk in (weekly || {})) {
    const wn = parseInt(wk);
    if (isNaN(wn)) continue;
    const row = weekly[wk];
    if (!row || typeof row !== 'object') continue;
    const s = row.stats || {};
    const opp = row.opponent || row.opp || null;
    const team = row.team || null;
    const isAway = (typeof row.is_away_team === 'boolean') ? row.is_away_team
      : ((row.game_id && team && opp) ? (row.game_id.indexOf(team) > row.game_id.indexOf(opp)) : false);
    const gp = s.gp || 0;
    rows.push({
      wk: wn, opp, isAway, gp, team, stats: s,
      bye: gp === 0 && !opp,
      dnp: gp === 0 && !!opp,
      cats: baflPlayerCats(s),
    });
  }
  rows.sort((a, b) => a.wk - b.wk);
  return rows;
}

// The games that actually count toward per-game figures and consistency.
//
// Sleeper omits `gp` for a week the player missed, which pcSeasonRows already turns into a
// DNP row — those never counted. This adds the subtler case: a player who was ACTIVE but
// never took the field. He has gp, so he looks like a game played, but he had no opportunity
// to produce and grading him on it would be grading him for being healthy. Only excluded
// when the snap counts are actually present, since Sleeper doesn't carry them for every
// season, and never for kickers (who take no offensive snaps by definition).
function pcPlayedRows(rows, pos) {
  const isK = String(pos || '').toUpperCase() === 'K';
  return (rows || []).filter(r => {
    if (r.bye || r.dnp || !(r.gp > 0)) return false;
    if (isK) return true;
    const s = r.stats || {};
    if (s.off_snp === 0 && (s.tm_off_snp || 0) > 0) return false;   // dressed, never played
    return true;
  });
}

// Derived box-score values that aren't raw Sleeper fields (rates, and the K miss count).
// Stats Sleeper genuinely may not have, as opposed to ones it merely omits when zero.
const PC_NULLABLE = new Set(['pass_lng', 'rush_lng', 'rec_lng', 'fgm_lng']);
function pcDerived(key, s) {
  s = s || {};
  switch (key) {
    case '_cmp_pct': return (s.pass_att > 0) ? (s.pass_cmp || 0) / s.pass_att * 100 : null;
    case '_ru_ypc':  return (s.rush_att > 0) ? (s.rush_yd || 0) / s.rush_att : null;
    case '_re_ypc':  return (s.rec > 0) ? (s.rec_yd || 0) / s.rec : null;
    case 'fgmiss':   return Math.max(0, (s.fga || 0) - (s.fgm || 0));
    default:
      if (s[key] != null) return s[key];
      // Sleeper drops zero-valued counting stats from the payload entirely. Rendering those as
      // "–" implies missing data; they are real zeroes and must read as 0.
      return PC_NULLABLE.has(key) ? null : 0;
  }
}

// ─── Season table ─────────────────────────────────────────────────────────
function renderPcSeason(season, rows, pos) {
  const P = String(pos || '').toUpperCase();
  const cats = pcCatsForPos(P);
  const box = PC_BOX_SCHEMA[P];
  const totalBench = PC_TOTAL_BENCH[P];
  // Positions with no BAFL category mapping (defenders, punters) still get their box score —
  // they just don't get a category group, because they don't score in this league.
  const catCols = cats ? cats.map(([k, g, o]) => ({ key: k, label: PC_CAT_LABEL[k], good: g, ok: o })) : [];
  const showTotal = !!(cats && totalBench);

  // Header: a BAFL group, then the raw box-score groups, with a spacer column between each.
  const gap = !!(catCols.length && box);   // spacer column between the two groups
  let grpRow = '';
  if (catCols.length) {
    grpRow += `<th class="pc-grp pc-grp-bafl" colspan="${catCols.length + (showTotal ? 1 : 0)}">BAFL CATEGORIES</th>`;
    if (gap) grpRow += '<th></th>';
  }
  let colRow = catCols.map(c => `<th>${c.label}</th>`).join('') + (showTotal ? '<th>TOT</th>' : '');
  if (gap) colRow += '<th></th>';
  if (box) {
    box.groups.forEach((g, gi) => {
      const span = box.cols.filter(c => c.grp === gi).length;
      grpRow += `<th class="pc-grp" colspan="${span}">${g}</th>` + (gi < box.groups.length - 1 ? '<th></th>' : '');
    });
    box.cols.forEach((c, i) => {
      const prev = box.cols[i - 1];
      colRow += ((prev && prev.grp !== c.grp) ? '<th></th>' : '') + `<th>${c.label}</th>`;
    });
  }

  const bodyRows = rows.map(r => {
    const nCells = catCols.length + (showTotal ? 1 : 0) + (gap ? 1 : 0) +
      (box ? box.cols.length + (box.groups.length - 1) : 0);
    if (r.bye || r.dnp) {
      const label = r.bye ? 'BYE' : 'DNP';
      return `<tr class="pc-row-${r.bye ? 'bye' : 'dnp'}"><td class="pc-wk">${r.wk}</td>` +
        `<td class="pc-opp">${label}</td><td class="pc-cell bye" colspan="${nCells}">–</td></tr>`;
    }
    let cells = catCols.map(c => {
      const v = r.cats[c.key] || 0;
      return `<td class="pc-cell pc-cat-cell ${triHigh(v, c.good, c.ok)}">${Math.round(v)}</td>`;
    }).join('');
    if (showTotal) {
      const ty = baflTotalYards(r.cats);
      cells += `<td class="pc-cell pc-cat-cell pc-tot-cell ${triHigh(ty, totalBench[0], totalBench[1])}">${Math.round(ty)}</td>`;
    }
    if (gap) cells += '<td></td>';
    if (box) {
      cells += box.cols.map((c, i) => {
        const prev = box.cols[i - 1];
        const sep = (prev && prev.grp !== c.grp) ? '<td></td>' : '';
        const v = pcDerived(c.key, r.stats);
        const display = c.fmt ? c.fmt(v) : (v == null ? '–' : fmtNum(v, 1));
        return sep + `<td class="pc-cell ${c.color ? c.color(v) : ''}">${display}</td>`;
      }).join('');
    }
    const oppTxt = r.opp
      ? `<span class="pc-opp-inner">${r.isAway ? '<span class="pc-at">@</span>' : '<span class="pc-vs">vs</span>'}` +
        `<img src="${NFL_LOGO(r.opp)}" class="pc-opp-logo" onerror="this.style.display='none'"><span>${esc(r.opp)}</span></span>`
      : '–';
    const started = pcStartedFlag(season, r.wk);
    return `<tr><td class="pc-wk">${r.wk}${started}</td>` +
      `<td class="pc-opp ${r.isAway ? 'away' : 'home'}">${oppTxt}</td>${cells}</tr>`;
  }).join('');

  const totalsRow = pcTotalsRow(rows, P, catCols, showTotal, totalBench, box);
  const teamTag = pcSeasonTeamTag(rows);
  return `<div class="pc-season">
    <div class="pc-season-title">${esc(season)}${teamTag}${pcSeasonBadges(rows, P, season)}</div>
    <div class="pc-table-scroll"><table class="pc-table">
      <thead>
        <tr><th></th><th></th>${grpRow}</tr>
        <tr><th class="pc-th-wk">WK</th><th>OPP</th>${colRow}</tr>
      </thead>
      <tbody>${bodyRows}${totalsRow}</tbody>
    </table></div>
  </div>`;
}

// Season totals: category values sum, counting stats sum, "long" columns take the max, and
// rates are recomputed from the summed components rather than averaged (averaging a per-game
// YPC across games is simply the wrong number).
function pcTotalsRow(rows, pos, catCols, showTotal, totalBench, box) {
  const played = pcPlayedRows(rows, pos);
  if (!played.length) return '';
  const games = played.length;
  const catSum = {};
  BAFL_CATS.forEach(c => { catSum[c.key] = 0; });
  const t = {};
  const SUM = ['pass_cmp','pass_att','pass_yd','pass_td','pass_int','pass_sack',
               'rush_att','rush_yd','rush_td','rec_tgt','rec','rec_yd','rec_td','fgm','fga','xpm','xpa'];
  const MAX = ['pass_lng','rush_lng','rec_lng','fgm_lng'];
  for (const r of played) {
    BAFL_CATS.forEach(c => { catSum[c.key] += r.cats[c.key] || 0; });
    const s = r.stats || {};
    for (const k of SUM) t[k] = (t[k] || 0) + (s[k] || 0);
    for (const k of MAX) t[k] = Math.max(t[k] || 0, s[k] || 0);
  }
  // The totals row is graded on the PER-GAME average, so its colors mean the same thing as
  // the weekly rows above it — a green season total is a season of green weeks.
  let cells = catCols.map(c => {
    const tot = catSum[c.key], pg = tot / games;
    return `<td class="pc-cell pc-total-cell pc-cat-cell ${triHigh(pg, c.good, c.ok)}"
      title="${escAttr(`${Math.round(pg)} per game over ${games} games`)}">${Math.round(tot)}</td>`;
  }).join('');
  if (showTotal) {
    const ty = catSum.passing + catSum.rushing + catSum.receiving;
    cells += `<td class="pc-cell pc-total-cell pc-cat-cell pc-tot-cell ${triHigh(ty / games, totalBench[0], totalBench[1])}"
      title="${escAttr(`${Math.round(ty / games)} yards per game`)}">${Math.round(ty)}</td>`;
  }
  if (catCols.length && box) cells += '<td></td>';
  if (box) {
    cells += box.cols.map((c, i) => {
      const prev = box.cols[i - 1];
      const sep = (prev && prev.grp !== c.grp) ? '<td></td>' : '';
      const v = pcDerived(c.key, t);
      const display = c.fmt ? c.fmt(v) : (v == null ? '–' : fmtNum(v, 1));
      return sep + `<td class="pc-cell pc-total-cell">${display}</td>`;
    }).join('');
  }
  return `<tr class="pc-total-row"><td class="pc-wk">TOT</td><td class="pc-opp">${games}g</td>${cells}</tr>`;
}

// Teams the player logged games for — makes a midseason trade legible at a glance.
function pcSeasonTeamTag(rows) {
  const teams = [...new Set(rows.filter(r => !r.bye && r.team).map(r => r.team))];
  if (!teams.length) return '';
  const inner = teams.map(t =>
    `<img src="${NFL_LOGO(t)}" class="pc-season-logo" onerror="this.style.display='none'">${esc(t)}`).join(' / ');
  return ` <span class="pc-season-team">· ${inner}</span>`;
}

// Headline badges. The yards-per-game figure is available immediately; the consistency grade
// needs the league's positional benchmark for that season, so it is fetched separately and
// dropped in when it lands (same pattern as the draft banner) rather than delaying the table.
function pcSeasonBadges(rows, pos, season) {
  const played = pcPlayedRows(rows, pos);
  if (!pcCatsForPos(pos) || played.length < 2) return '';
  const isK = String(pos || '').toUpperCase() === 'K';
  const perGame = played.reduce((a, r) => a + benchMetric(r.stats, pos), 0) / played.length;
  const unit = isK ? 'pts/g' : 'yd/g';
  const what = isK ? 'kicking points' : 'total yards';
  const tip = `${perGame.toFixed(1)} ${what} per game over ${played.length} games played.`;
  const hasScale = isK || !!PC_TOTAL_BENCH[String(pos).toUpperCase()];
  const ypg = hasScale
    ? ` <span class="pc-badge pc-badge-ypg" title="${escAttr(tip)}">${Math.round(perGame)} ${unit}</span>` : '';
  // Slot filled asynchronously by applyConsistencyBadge().
  return `${ypg}<span class="pc-cons-slot" data-season="${escAttr(season)}"></span>`;
}

// Share of games played in which the player beat replacement level at his position, that
// season. This is the whole point of deriving the benchmark from league data: a grade is only
// meaningful relative to what everyone else at the position was doing.
async function applyConsistencyBadge(season, rows, pos) {
  const slot = document.querySelector(`.pc-cons-slot[data-season="${CSS.escape(String(season))}"]`);
  if (!slot) return;
  const played = pcPlayedRows(rows, pos);
  // Four games is the floor for saying anything about consistency; below that it's one hot
  // or cold stretch, not a trait.
  if (played.length < 4) return;
  const bench = await positionalBenchmark(pos, season);
  if (!bench || !slot.isConnected) return;
  const hits = played.filter(r => benchMetric(r.stats, pos) >= bench.value).length;
  const rate = hits / played.length;
  const grade = consistencyGrade(rate);
  const isK = String(pos || '').toUpperCase() === 'K';
  const unit = isK ? 'kicking points' : 'total yards';
  const tip = `Beat ${Math.round(bench.value)} ${unit} in ${hits} of ${played.length} games played `
    + `(${(rate * 100).toFixed(0)}%).\n\nThat bar is 85% of what the #${bench.rank} ${String(pos).toUpperCase()} `
    + `averaged per game in ${season} (${Math.round(bench.lastStarter)}/g) — the last player at the position `
    + `this league starts, so roughly replacement level.`;
  slot.outerHTML = ` <span class="pc-badge pc-cons-${grade}" title="${escAttr(tip)}">Consistency ${grade}</span>`;
}

// A dot on the week number when the player was in a BAFL starting lineup that week. Only
// meaningful for the league season currently loaded, and only for weeks already in the cache —
// this deliberately does not trigger a 14-week fetch just to draw a dot.
function pcStartedFlag(season, week) {
  if (!S.league || String(S.league.season) !== String(season)) return '';
  const wd = S.weekCache[`${lid()}:${week}`];
  if (!wd) return '';
  const pid = PC && PC.pid;
  const inLineup = (wd.matchups || []).some(m => (m.starters || []).includes(pid));
  return inLineup ? `<span class="pc-started" title="Started in BAFL this week">●</span>` : '';
}

// ─── ESPN-sourced game logs ───────────────────────────────────────────────
// Serves two cases with one code path:
//   • the College tab, for any player;
//   • the NFL tab for positions with no hand-built box score (defenders, punters). Those
//     players never appear in a BAFL lineup, but player search can reach anyone in the NFL, and
//     a card that renders a header with no stat columns is worse than no card. ESPN's gamelog
//     is self-describing, so it supplies the right columns for whatever the position is.
// ESPN publishes its own season list inside the payload, so the derived season pills don't
// apply here — they're hidden for this mode.
async function loadPcCollege() { return loadPcEspn('college-football'); }

async function loadPcEspn(league) {
  if (!PC) return;
  const pid = PC.pid, tok = ++pcToken;
  const isCollege = league === 'college-football';
  const body = document.getElementById('pcBody');
  if (body) body.innerHTML = `<div class="pc-loading">Loading ${isCollege ? 'college ' : ''}game logs…</div>`;
  const p = playerRec(pid);
  const aid = await resolveEspnAthleteId(pid, p && p.name, league);
  if (!PC || PC.pid !== pid || tok !== pcToken) return;
  if (!aid) {
    if (body) body.innerHTML = `<div class="pc-empty">No ESPN ${isCollege ? 'college ' : ''}record found for this player.</div>`;
    return;
  }
  // fetchSoft, not fetchEspnGamelog: ESPN simply has no college gamelog for many players
  // (notably anyone whose college career predates its coverage), and that is an ordinary
  // outcome to report — not an error to offer a pointless retry for.
  const base = await fetchSoft(ESPN_GAMELOG_URL(league, aid, null));
  if (!PC || PC.pid !== pid || tok !== pcToken) return;
  if (!base) {
    if (body) body.innerHTML = `<div class="pc-empty">ESPN has no ${isCollege ? 'college ' : ''}game log for this player.
      ${isCollege ? `<div class="pc-empty-sub">Coverage thins out for players whose college careers predate ESPN's game-by-game data.</div>` : ''}</div>`;
    return;
  }
  try {
    let seasons = [];
    for (const f of (base.filters || [])) if (f.name === 'season') seasons = (f.options || []).map(o => o.value);
    if (!seasons.length) {
      const m = /\d{4}/.exec((base.seasonTypes && base.seasonTypes[0] && base.seasonTypes[0].displayName) || '');
      if (m) seasons = [m[0]];
    }
    seasons.sort((a, b) => Number(b) - Number(a));
    const perSeason = await Promise.all(seasons.map(async s =>
      ({ season: s, gl: await fetchSoft(ESPN_GAMELOG_URL(league, aid, s)) })));
    if (!PC || PC.pid !== pid || tok !== pcToken) return;
    let out = '';
    for (const { season, gl } of perSeason) if (gl) out += renderEspnSeason(season, gl, league);
    if (!out) out = `<div class="pc-empty">No ${isCollege ? 'college ' : ''}game data found for this player.</div>`;
    else out += `<div class="pc-src">${isCollege ? 'College' : 'NFL'} per-game stats via ESPN · AVG shown as YPC.</div>`;
    if (body) body.innerHTML = out;
  } catch {
    if (body) body.innerHTML = pcRetryHTML(`Couldn't load ${isCollege ? 'college ' : ''}game logs.`);
  }
}

// ─── Swipe-down to close ──────────────────────────────────────────────────
// Standard mobile sheet behaviour. The drag must START ON THE HERO: that region doesn't
// scroll, so a downward swipe there is unambiguous, whereas starting inside the body would
// fight the game log's own scrolling. touchmove is deliberately NON-passive — a passive
// listener can't preventDefault, which would leave the browser running pull-to-refresh and
// background scroll underneath the drag.
function attachPcSwipe(cardEl) {
  if (!cardEl || cardEl._swipeWired) return;
  cardEl._swipeWired = true;
  const CLOSE_AT = 90;
  let y0 = null, dy = 0, dragging = false;

  cardEl.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) { dragging = false; y0 = null; return; }
    const t = e.target;
    const onHero = t && t.closest && t.closest('.pc-hero');
    const onControl = t && t.closest && t.closest('.pc-close');
    if (!onHero || onControl) { dragging = false; y0 = null; return; }
    y0 = e.touches[0].clientY; dy = 0; dragging = true;
    cardEl.style.transition = '';
  }, { passive: true });

  cardEl.addEventListener('touchmove', e => {
    if (!dragging || y0 == null) return;
    dy = e.touches[0].clientY - y0;
    if (dy <= 0) { cardEl.style.transform = ''; cardEl.style.opacity = ''; return; }
    if (e.cancelable) e.preventDefault();   // we own this gesture now
    // Resistance, so the card feels attached rather than free-falling.
    const shift = dy < CLOSE_AT ? dy * 0.7 : CLOSE_AT * 0.7 + (dy - CLOSE_AT) * 0.35;
    cardEl.style.transform = `translateY(${shift.toFixed(1)}px)`;
    cardEl.style.opacity = String(Math.max(0.55, 1 - dy / 600));
  }, { passive: false });

  const finish = () => {
    if (!dragging) return;
    dragging = false; y0 = null;
    cardEl.style.opacity = '';
    if (dy > CLOSE_AT) closePlayerCard();
    else {
      cardEl.style.transition = 'transform .18s ease-out';
      cardEl.style.transform = '';
      setTimeout(() => { cardEl.style.transition = ''; }, 200);
    }
    dy = 0;
  };
  cardEl.addEventListener('touchend', finish, { passive: true });
  cardEl.addEventListener('touchcancel', finish, { passive: true });
}
// ─── Player search ────────────────────────────────────────────────────────
// Type a name, get every matching NFL player with the one piece of information this league
// actually wants: WHO ROSTERS HIM. Rostered players sort to the top and carry their BAFL
// owner; everyone else reads "Free agent". Clicking a result opens the player card.
let psOpen = false;
let psRosteredOnly = false;

// Normalized name matching, so "aj brown", "A.J. Brown" and "aj brown jr" all match.
function psNorm(s) {
  return String(s || '').toLowerCase()
    .replace(/[.'\-]/g, '')
    .replace(/\s+(jr|sr|ii|iii|iv|v)$/, '')
    .replace(/\s+/g, ' ')
    .trim();
}

async function openPlayerSearch() {
  if (psOpen) return;
  if (!S.playersCache) {
    try { await loadPlayers(); }
    catch { toast('Player data still loading — try again in a moment', 'err'); return; }
  }
  psOpen = true;
  const ov = document.createElement('div');
  ov.id = 'psOverlay';
  ov.className = 'ps-overlay';
  ov.innerHTML = `
    <div class="ps-modal" role="dialog" aria-label="Search players">
      <div class="ps-head">
        <span class="ps-ico">🔍</span>
        <input id="psInput" class="ps-input" type="text" autocomplete="off" spellcheck="false"
               placeholder="Search any NFL player…" aria-label="Player name">
        <button id="psRosterToggle" class="ps-toggle" onclick="psToggleRostered()"
                aria-pressed="false" title="Show only players rostered in BAFL">BAFL</button>
        <button class="ps-close" onclick="closePlayerSearch()" aria-label="Close">✕</button>
      </div>
      <div id="psResults" class="ps-results"></div>
    </div>`;
  ov.addEventListener('mousedown', e => { if (e.target === ov) closePlayerSearch(); });
  document.body.appendChild(ov);
  pcLockPage(true);
  const inp = document.getElementById('psInput');
  inp.addEventListener('input', () => psRender(inp.value));
  inp.addEventListener('keydown', psKey);
  psRender('');
  setTimeout(() => inp.focus(), 30);
}

function closePlayerSearch() {
  psOpen = false;
  const el = document.getElementById('psOverlay');
  if (el) el.remove();
  if (!PC && !document.getElementById('rosterOverlay')?.classList.contains('active')) pcLockPage(false);
}
function psToggleRostered() {
  psRosteredOnly = !psRosteredOnly;
  const btn = document.getElementById('psRosterToggle');
  if (btn) { btn.classList.toggle('on', psRosteredOnly); btn.setAttribute('aria-pressed', String(psRosteredOnly)); }
  psRender(document.getElementById('psInput')?.value || '');
}
function psKey(e) {
  if (e.key === 'Escape') { e.stopPropagation(); closePlayerSearch(); return; }
  if (e.key === 'Enter') {
    const first = document.querySelector('#psResults .ps-row');
    if (first) first.click();
  }
}

// With no query, show the league itself — every rostered player — which doubles as a quick
// "who's on a roster right now" view. With a query, search the whole NFL.
function psCandidates(q) {
  const players = S.playersCache || {};
  const nq = psNorm(q);
  const out = [];
  for (const pid in players) {
    const p = players[pid];
    const owned = !!(S.ownerByPid && S.ownerByPid[pid]);
    if (psRosteredOnly && !owned) continue;
    if (!nq) { if (owned) out.push({ pid, p, owned }); continue; }
    const n = psNorm(p.name);
    if (!n.includes(nq)) continue;
    out.push({ pid, p, owned, exact: n.startsWith(nq) });
  }
  out.sort((a, b) => {
    if (a.owned !== b.owned) return a.owned ? -1 : 1;          // rostered first
    if (!!a.exact !== !!b.exact) return a.exact ? -1 : 1;      // then prefix matches
    return (a.p.name || '').localeCompare(b.p.name || '');
  });
  return out;
}

function psRender(q) {
  const el = document.getElementById('psResults');
  if (!el) return;
  const all = psCandidates(q);
  const CAP = 60;
  const hits = all.slice(0, CAP);
  if (!hits.length) {
    el.innerHTML = `<div class="ps-empty">${q ? 'No players match that name.' : 'No rostered players loaded yet.'}</div>`;
    return;
  }
  el.innerHTML = hits.map(({ pid, p, owned }) => {
    const pos = (p.pos || '?').toUpperCase();
    const own = owned ? ownerOf(pid) : null;
    const ownTag = own
      ? `<span class="ps-owner">${esc(own.name)}</span>`
      : `<span class="ps-owner ps-fa">FA</span>`;
    return `<div class="ps-row" onclick="closePlayerSearch();openPlayerCard(${jsArg(pid)})">
      ${headshotImg(pid, p, 'ps-hs', (p.name || '?')[0])}
      <span class="pos-badge pos-${esc(pos)}">${esc(pos)}</span>
      <div class="ps-name-block">
        <span class="ps-name">${esc(p.name || pid)}</span>
        <span class="ps-team">${esc(p.team || 'FA')}</span>
      </div>
      ${ownTag}
    </div>`;
  }).join('');
  // Never silently truncate: say so, so an absent player reads as "narrow your search" rather
  // than "he isn't in the database".
  if (all.length > CAP) {
    el.innerHTML += `<div class="ps-more">Showing ${CAP} of ${all.length} matches — keep typing to narrow.</div>`;
  }
}
// ═══════════════════════════════════════════════════════════════════════════
// Positional benchmarks
// ═══════════════════════════════════════════════════════════════════════════
// What counts as a good game depends entirely on the position and the season. Hard-coded
// numbers get this wrong in both directions and age badly: the original TE benchmark of 60
// receiving yards sat ABOVE what the NFL's best tight end averaged, so no tight end could
// ever grade well no matter how good he was.
//
// So the benchmark is derived from the season being viewed:
//
//   1. Pull season totals for every player at the position (one request per position per
//      season, ~45–140KB gzipped, cached).
//   2. Reduce each to a per-game figure in the metric that matters in BAFL — total yards
//      (net of the interception penalty) for skill positions, kicking points for kickers.
//   3. Rank them, and find the LAST STARTABLE player: rank N, where N is how many of that
//      position the league actually starts league-wide (2 QB × 10 teams = 20, 1 TE × 10 = 10,
//      and so on, read from the league's own roster settings).
//   4. Benchmark = 85% of that player's per-game figure — roughly replacement level.
//
// Why a FRACTION of the last starter rather than a deeper rank: rank offsets don't mean the
// same thing in a 65-deep QB pool as in a 217-deep WR pool, which made wide receivers grade
// systematically worse than quarterbacks for no reason but positional depth. Scaling by
// production instead of rank is depth-independent — checked against 2025, it holds the median
// starter's hit rate within 58–76% across all five positions, versus a 21-point spread for
// rank-based definitions.
const BENCH_FACTOR = 0.85;   // share of the last starter's per-game output = replacement level
const BENCH_MIN_GP = 4;      // ignore tiny samples when ranking the pool
const BENCH_SEASON_STATS_URL = (season, pos) =>
  `${API2}/stats/nfl/${season}?season_type=regular&grouping=season&position%5B%5D=${pos}`;

// Slots per team, if the league object can't be read (matches BAFL's own settings).
const DEFAULT_STARTER_SLOTS = { QB: 2, RB: 2, WR: 2, TE: 1, K: 2 };
// Which positions each flex slot can be filled by.
const FLEX_ELIGIBLE = {
  FLEX: ['RB', 'WR', 'TE'],
  WRRB_FLEX: ['RB', 'WR'],
  REC_FLEX: ['WR', 'TE'],
  SUPER_FLEX: ['QB', 'RB', 'WR', 'TE'],
};

// How many of this position get started across the whole league. Flex slots are counted
// toward every position eligible for them, which over-counts slightly in leagues that have
// them — harmless here, since BAFL has none, and it only nudges which player defines the bar.
function leagueStarterCount(pos) {
  const P = String(pos || '').toUpperCase();
  const teams = (S.rosters && S.rosters.length) || (S.league && S.league.total_rosters) || 10;
  const slots = (S.league && S.league.roster_positions) || null;
  if (!slots) return (DEFAULT_STARTER_SLOTS[P] || 1) * teams;
  let per = 0;
  for (const slot of slots) {
    if (slot === P) per++;
    else if (FLEX_ELIGIBLE[slot] && FLEX_ELIGIBLE[slot].includes(P)) per++;
  }
  if (!per) per = DEFAULT_STARTER_SLOTS[P] || 1;
  return per * teams;
}

// The BAFL value of one stat line, as a single number, for ranking and grading. Kickers are
// measured in kicking points; everyone else in total yards. This is the same figure the
// card's "yd/g" badge shows, so the badge and the grade always describe the same thing.
function benchMetric(stats, pos) {
  const c = baflPlayerCats(stats);
  return String(pos).toUpperCase() === 'K' ? c.kicking : baflTotalYards(c);
}

// Resolve (and cache) the benchmark for one position in one season.
// Returns {value, lastStarter, rank, pool} or null when the season has no usable data.
S.benchCache = S.benchCache || {};
function positionalBenchmark(pos, season) {
  const P = String(pos || '').toUpperCase();
  const key = `${season}:${P}`;
  if (S.benchCache[key] !== undefined) return S.benchCache[key];
  S.benchCache[key] = (async () => {
    const rows = await fetchSoft(BENCH_SEASON_STATS_URL(season, P), null);
    if (!Array.isArray(rows) || !rows.length) return null;
    const perGame = [];
    for (const r of rows) {
      const s = r.stats || {};
      const gp = s.gp || 0;
      if (gp < BENCH_MIN_GP) continue;    // one huge game shouldn't set the league's bar
      perGame.push(benchMetric(s, P) / gp);
    }
    if (perGame.length < 5) return null;
    perGame.sort((a, b) => b - a);
    const n = Math.min(leagueStarterCount(P), perGame.length);
    const lastStarter = perGame[n - 1];
    if (!(lastStarter > 0)) return null;
    return { value: lastStarter * BENCH_FACTOR, lastStarter, rank: n, pool: perGame.length };
  })().catch(() => null);
  return S.benchCache[key];
}

// ─── Grade curve ──────────────────────────────────────────────────────────
// Calibrated against every startable player at all five positions in 2025. Median starter
// hit rates by position landed at QB 76% / RB 66% / WR 64% / K 64% / TE 58%, so the C band
// starts at 50% to put a typical starter in C/B at every position — tight end included, which
// is the position the old fixed benchmarks punished hardest. A is reserved for players who
// clear replacement level in roughly five games out of six.
// Adjust these four numbers to move the curve; nothing else reads them.
const CONSISTENCY_CURVE = [
  [0.82, 'A'],
  [0.66, 'B'],
  [0.50, 'C'],
  [0.38, 'D'],
];
function consistencyGrade(rate) {
  for (const [floor, g] of CONSISTENCY_CURVE) if (rate >= floor) return g;
  return 'F';
}
// ─── Core BAFL stat calculation ───────────────────────────────────────────
// BAFL is a five-category league, not a points league. Every view in the app — matchups,
// standings, leaders, and now the player card — has to agree on exactly what a stat line is
// worth, so the per-player conversion lives here once and everything else calls it.
//
//   Passing:   raw pass yards minus 20 per interception
//   Rushing:   rush yards
//   Receiving: receiving yards
//   Touchdowns: pass + rush + rec TDs
//   Kicking:   XPM + 3×FGM + 2×(2PT conversions)
const BAFL_CATS = [
  { key: 'passing',   label: 'Passing'    },
  { key: 'receiving', label: 'Receiving'  },
  { key: 'rushing',   label: 'Rushing'    },
  { key: 'tds',       label: 'Touchdowns' },
  { key: 'kicking',   label: 'Kicking'    },
];

// One player's stat line → his BAFL category contribution. `ps` is a Sleeper stats object,
// from either the weekly league feed or the per-player season feed — they share field names.
function baflPlayerCats(ps) {
  ps = ps || {};
  return {
    passing:   (ps.pass_yd || 0) - (ps.pass_int || 0) * 20,
    rushing:   (ps.rush_yd || 0),
    receiving: (ps.rec_yd  || 0),
    tds:       (ps.pass_td || 0) + (ps.rec_td || 0) + (ps.rush_td || 0),
    kicking:   (ps.xpm || 0)
             + (ps.fgm || 0) * 3
             + ((ps.pass_2pt || 0) + (ps.rec_2pt || 0) + (ps.rush_2pt || 0)) * 2,
  };
}
// Total yardage — the standings tiebreaker, and the player card's headline number.
function baflTotalYards(cats) {
  return (cats.passing || 0) + (cats.rushing || 0) + (cats.receiving || 0);
}

// Accumulates per-roster category totals from a week's matchups + stats dict.
function calcCatStats(matchups, statsDict) {
  const passing = {}, rushing = {}, receiving = {}, tds = {}, kicking = {};
  for (const m of matchups) {
    const rid = m.roster_id;
    passing[rid] = rushing[rid] = receiving[rid] = tds[rid] = kicking[rid] = 0;
  }
  for (const m of matchups) {
    const rid = m.roster_id;
    const starters = m.starters || [];
    const pp = m.players_points || {};
    for (const pid of starters) {
      if (!(pid in pp)) continue;   // player did not participate (same check as Python)
      const c = baflPlayerCats(statsDict[pid]);
      passing[rid]   += c.passing;
      rushing[rid]   += c.rushing;
      receiving[rid] += c.receiving;
      tds[rid]       += c.tds;
      kicking[rid]   += c.kicking;
    }
  }
  return { passing, rushing, receiving, tds, kicking };
}

// Category comparison: 0 = rid1 wins, 1 = rid2 wins, 2 = tie  (same logic as Python)
function cmp(a, b) { return a > b ? 0 : b > a ? 1 : 2; }

// Full matchup result between two roster IDs using pre-computed cat stats
function calcResult(cs, rid1, rid2) {
  const cats = {
    Passing:    cmp(cs.passing[rid1]  || 0, cs.passing[rid2]  || 0),
    Receiving:  cmp(cs.receiving[rid1]|| 0, cs.receiving[rid2]|| 0),
    Rushing:    cmp(cs.rushing[rid1]  || 0, cs.rushing[rid2]  || 0),
    Touchdowns: cmp(cs.tds[rid1]      || 0, cs.tds[rid2]      || 0),
    Kicking:    cmp(cs.kicking[rid1]  || 0, cs.kicking[rid2]  || 0),
  };
  let s1 = 0, s2 = 0;
  for (const v of Object.values(cats)) { if (v===0) s1++; else if (v===1) s2++; }
  const ty1 = (cs.passing[rid1]||0) + (cs.rushing[rid1]||0) + (cs.receiving[rid1]||0);
  const ty2 = (cs.passing[rid2]||0) + (cs.rushing[rid2]||0) + (cs.receiving[rid2]||0);
  const tie = s1 === s2;
  const tb1 = tie && ty1 > ty2;   // team1 wins tiebreaker (shown as *)
  const tb2 = tie && ty2 > ty1;
  return {
    cats, s1, s2,
    s1dec: s1 + (tb1 ? .5 : 0),
    s2dec: s2 + (tb2 ? .5 : 0),
    ty1, ty2, tb1, tb2,
  };
}

// ─── Matchup card HTML ────────────────────────────────────────────────────
// The team names used to be <th> cells in the same table as the category rows. That forced one
// table row to budget score + name + "Categories" + name + score across the viewport, and on a
// 360px phone that row alone overflowed — and because the page is overflow-x:hidden, it was
// CLIPPED rather than scrollable, so the right-hand score was simply unreachable.
//
// The names now live in their own flex header above the table. The table is left with the five
// narrow data columns, which fit any phone; it still gets a scroll wrapper with a frozen
// category column as a safety net for very long category labels at large text sizes.
function matchupCard(rid1, rid2, cs, pcs) {
  const r = calcResult(cs, rid1, rid2);
  const name = rid => esc(S.rosterMap[rid] || `Team ${rid}`);
  const s1s = r.tb1 ? `${r.s1}*` : String(r.s1);
  const s2s = r.tb2 ? `${r.s2}*` : String(r.s2);
  const cls1 = r.s1dec > r.s2dec ? 'win' : r.s1dec < r.s2dec ? 'loss' : 'tie';
  const cls2 = r.s2dec > r.s1dec ? 'win' : r.s2dec < r.s1dec ? 'loss' : 'tie';
  const tbTip = 'Category tie broken on total yards';

  const rows = BAFL_CATS.map(c => {
    const cr = r.cats[c.label];
    const v1 = cs[c.key][rid1] || 0;
    const v2 = cs[c.key][rid2] || 0;
    // Projected finish, when we have it: a second line under each value plus a hollow check
    // on the side projected to win, so a category you're losing but projected to take reads
    // differently from one you're losing outright.
    let p1 = '', p2 = '', pchk1 = '', pchk2 = '';
    if (pcs) {
      const pv1 = pcs[c.key][rid1] || 0, pv2 = pcs[c.key][rid2] || 0;
      p1 = `<span class="mc-proj">→${Math.round(pv1)}</span>`;
      p2 = `<span class="mc-proj">→${Math.round(pv2)}</span>`;
      const pwin = pv1 > pv2 ? 0 : pv2 > pv1 ? 1 : 2;
      if (pwin === 0 && cr !== 0) pchk1 = '<span class="mc-pchk" title="Projected to win this category">○</span>';
      if (pwin === 1 && cr !== 1) pchk2 = '<span class="mc-pchk" title="Projected to win this category">○</span>';
    }
    const chk = '<span class="mc-tick">✔</span>';
    return `<tr>
      <td class="mc-chk">${cr === 0 ? chk : pchk1}</td>
      <td class="mc-val">${Math.round(v1)}${p1}</td>
      <td class="mc-cat">${c.label}</td>
      <td class="mc-val mc-val-r">${Math.round(v2)}${p2}</td>
      <td class="mc-chk mc-chk-r">${cr === 1 ? chk : pchk2}</td>
    </tr>`;
  }).join('');

  // Total yards is the tiebreaker when the category score is level, so it gets a projection
  // too — otherwise a projected 2–2 gives you no read on who actually takes it.
  let pt1 = '', pt2 = '';
  if (pcs) {
    const pr = calcResult(pcs, rid1, rid2);
    pt1 = `<span class="mc-proj">→${Math.round(pr.ty1)}</span>`;
    pt2 = `<span class="mc-proj">→${Math.round(pr.ty2)}</span>`;
  }

  return `
  <div class="mc">
    <div class="mc-head">
      <div class="mc-side">
        <span class="mc-score ${cls1}"${r.tb1 ? ` title="${escAttr(tbTip)}"` : ''}>${s1s}</span>
        <span class="mc-team team-link" onclick="openRosterModal(${rid1})">${name(rid1)}</span>
      </div>
      <span class="mc-vs">vs</span>
      <div class="mc-side mc-side-r">
        <span class="mc-team team-link" onclick="openRosterModal(${rid2})">${name(rid2)}</span>
        <span class="mc-score ${cls2}"${r.tb2 ? ` title="${escAttr(tbTip)}"` : ''}>${s2s}</span>
      </div>
    </div>
    ${pcs ? projScoreHTML(pcs, rid1, rid2) : ''}
    <div class="mc-table-scroll">
      <table class="mc-tbl">
        <tbody>
          ${rows}
          <tr class="mc-total">
            <td></td>
            <td class="mc-val">${Math.round(r.ty1)}${pt1}</td>
            <td class="mc-cat">Total Yards</td>
            <td class="mc-val mc-val-r">${Math.round(r.ty2)}${pt2}</td>
            <td></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>`;
}
// ─── Live matchup projections ─────────────────────────────────────────────
// In a category league the useful in-season question isn't "am I ahead", it's "which
// categories are still winnable". Sleeper publishes a full-week projection for every player,
// so we can run the EXACT SAME category math over projected stat lines as over real ones —
// calcCatStats doesn't care whether the numbers it's handed already happened.
//
// Deliberate honesty about what this is: these are FULL-WEEK projections for the starting
// lineups, not "current score plus what's left". Sleeper's feed doesn't expose reliable
// per-game clock state, and a projection that silently mixes finished and unplayed games
// would be worse than one that's clearly labelled. The card shows actual and projected side
// by side and lets you read the gap yourself.

// One week of projections for every player: pid → stats. ~1000 rows, one request, cached.
async function loadWeekProjections(season, week) {
  const key = `${season}:${week}`;
  if (S.projCache[key]) return S.projCache[key];
  const rows = await fetchSoft(SLEEPER_WEEK_PROJ_URL(season, week), []);
  const out = {};
  for (const r of (rows || [])) {
    const pid = r.player_id || (r.player && r.player.player_id);
    if (pid && r.stats) out[String(pid)] = r.stats;
  }
  S.projCache[key] = out;
  return out;
}

// Projections are only meaningful for a week that hasn't finished — for any past week the
// actual result IS the answer, and showing a projection next to it is just noise.
function projectionsApply() {
  return isCurrentSeason() && S.selectedWeek === S.currentWeek && S.seasonStarted;
}

// Projected category totals in the same shape calcCatStats returns, so every downstream
// consumer (matchup card, score line, swing detection) treats them identically.
async function loadProjectedCats(matchups) {
  if (!projectionsApply()) return null;
  const proj = await loadWeekProjections(S.league.season, S.selectedWeek);
  if (!proj || !Object.keys(proj).length) return null;
  // calcCatStats skips any starter missing from players_points ("did not participate").
  // For a projection that check is wrong — nobody has participated yet — so hand it lineups
  // whose players_points marks every starter as present.
  const asIfPlayed = matchups.map(m => ({
    roster_id: m.roster_id,
    starters: m.starters || [],
    players_points: Object.fromEntries((m.starters || []).map(pid => [pid, 0])),
  }));
  return calcCatStats(asIfPlayed, proj);
}

// Which categories are close enough to still flip. Early in a week EVERY category is close,
// and a list naming all five is no signal at all — so the threshold is tight and the list is
// capped at the three closest, ordered by how close they are. When all five genuinely qualify
// we say so in three words instead of listing them.
const PROJ_SWING_PCT = 0.08;
const PROJ_SWING_MAX = 3;
function projSwingCategories(pcs, rid1, rid2) {
  if (!pcs) return { list: [], all: false };
  const close = [];
  for (const c of BAFL_CATS) {
    const a = pcs[c.key][rid1] || 0, b = pcs[c.key][rid2] || 0;
    const hi = Math.max(a, b);
    if (hi <= 0) continue;
    const gap = Math.abs(a - b) / hi;
    if (gap <= PROJ_SWING_PCT) close.push({ label: c.label, gap });
  }
  close.sort((x, y) => x.gap - y.gap);
  return { list: close.slice(0, PROJ_SWING_MAX).map(c => c.label), all: close.length === BAFL_CATS.length };
}

// The projected score line shown in the matchup card header, e.g. "Proj 3–2".
function projScoreHTML(pcs, rid1, rid2) {
  if (!pcs) return '';
  const r = calcResult(pcs, rid1, rid2);
  const swing = projSwingCategories(pcs, rid1, rid2);
  const tip = `Projected gap under ${Math.round(PROJ_SWING_PCT * 100)}% — still winnable`;
  const swingTxt = swing.all
    ? `<span class="proj-swing" title="${escAttr(tip)}">every category in play</span>`
    : swing.list.length
      ? `<span class="proj-swing" title="${escAttr(tip)}">${esc(swing.list.join(' · '))} in play</span>`
      : '';
  return `<div class="proj-bar">
    <span class="proj-lbl">PROJECTED</span>
    <span class="proj-score">${r.s1}<span class="proj-dash">–</span>${r.s2}</span>
    ${swingTxt}
  </div>`;
}
// ─── Render: Matchups tab ─────────────────────────────────────────────────
// Live results render FIRST and projections are patched in afterwards. That ordering is
// deliberate: a week of projections is ~230KB even after position filtering, and the actual
// score is the thing you opened the app for — it must never wait on a forecast.
function matchupsHTML(matchups, cs, pcs, dhPairs) {
  const groups = {};
  for (const m of matchups) {
    if (!groups[m.matchup_id]) groups[m.matchup_id] = [];
    groups[m.matchup_id].push(m.roster_id);
  }
  let html = '<div class="sec-head">Regular Matchups</div><div class="matchups-grid">';
  for (const rids of Object.values(groups)) {
    if (rids.length >= 2) html += matchupCard(rids[0], rids[1], cs, pcs);
  }
  html += '</div>';
  if (dhPairs && dhPairs.length) {
    html += `<div class="sec-spacer"></div>
           <div class="sec-head">Double Headers <span class="dh-badge">DH</span></div>
           <div class="matchups-grid">`;
    for (const { r1, r2 } of dhPairs) html += matchupCard(r1, r2, cs, pcs);
    html += '</div>';
  }
  return html;
}

async function renderMatchups() {
  if (!S.seasonStarted) return preDraftNotice();
  setLoading('Loading week data…');
  try {
    const { matchups, stats } = await loadWeek(S.selectedWeek);
    if (!matchups.length) {
      setPage('<div class="empty-box">No matchup data available for this week.</div>');
      return;
    }
    const cs = calcCatStats(matchups, stats);
    // Double header matchups — computed from the full-season schedule
    const dhPairs = DH_WEEKS.includes(S.selectedWeek)
      ? ((await getDHMatchups())[S.selectedWeek] || []) : [];

    setPage(matchupsHTML(matchups, cs, null, dhPairs));

    // Projections arrive later and re-render in place. Guarded on league + week + tab, because
    // by the time a 230KB response lands the user may well have moved on.
    if (projectionsApply()) {
      const league = lid(), week = S.selectedWeek;
      loadProjectedCats(matchups).then(pcs => {
        if (!pcs) return;
        if (lid() !== league || S.selectedWeek !== week || S.activeTab !== 'matchups') return;
        setPage(matchupsHTML(matchups, cs, pcs, dhPairs));
      }).catch(() => { /* the live view is already correct without them */ });
    }
  } catch (e) {
    setError('Failed to load week: ' + e.message);
  }
}
// ─── Render: Standings tab ────────────────────────────────────────────────
// Beyond W/L, the standings now carry each team's season category totals, heat-mapped by
// league rank. In a category league that grid is the most informative thing on the page: it
// shows at a glance who is a kicking specialist propped up by one category, who is a passing
// juggernaut, and exactly where a trade could help.
//
// The table is wide by design, so it lives in a horizontal scroll container with the RANK and
// TEAM columns frozen — you never lose track of whose row you're reading.

// Colour a value by its rank within the league: best fifth green through worst fifth red.
function heatClass(rank, n) {
  if (!n || rank == null) return '';
  const q = (rank - 1) / Math.max(1, n - 1);   // 0 = best, 1 = worst
  if (q <= 0.2) return 'hm1';
  if (q <= 0.4) return 'hm2';
  if (q <= 0.6) return 'hm3';
  if (q <= 0.8) return 'hm4';
  return 'hm5';
}
// rid → 1-based rank for one category (highest total ranks first).
function rankMapFor(totals, key) {
  const order = Object.keys(totals).sort((a, b) => totals[b][key] - totals[a][key]);
  const out = {};
  order.forEach((rid, i) => { out[rid] = i + 1; });
  return out;
}

// Season category totals per roster — the same accumulation the Leaders tab does, kept here
// so the standings never has to wait on that tab having been visited.
function seasonCatTotals(rsWeek) {
  const totals = {};
  for (const r of S.rosters) {
    totals[r.roster_id] = { passing: 0, rushing: 0, receiving: 0, tds: 0, kicking: 0 };
  }
  for (let w = 1; w <= rsWeek; w++) {
    const wd = S.weekCache[`${lid()}:${w}`];
    if (!wd || !wd.matchups.length) continue;
    const cs = calcCatStats(wd.matchups, wd.stats);
    for (const r of S.rosters) {
      const rid = r.roster_id;
      for (const c of BAFL_CATS) totals[rid][c.key] += cs[c.key][rid] || 0;
    }
  }
  return totals;
}

async function renderStandings() {
  if (!S.seasonStarted) return preDraftNotice();
  const rsWeek = Math.min(S.currentWeek, REGULAR_SEASON_WEEKS);
  setLoading('Calculating standings…', `Loading weeks 1–${rsWeek}…`);
  try {
    await loadAllWeeks((done, total) => {
      const el = document.querySelector('.loading-sub');
      if (el) el.textContent = `Loaded ${done} / ${total} weeks…`;
    });
    const dhData = await getDHMatchups();

    const st = {};
    for (const r of S.rosters) {
      st[r.roster_id] = { rid: r.roster_id, name: S.rosterMap[r.roster_id], wins: 0, losses: 0, ties: 0, pf: 0, pa: 0 };
    }

    for (let w = 1; w <= rsWeek; w++) {
      const wd = S.weekCache[`${lid()}:${w}`];
      if (!wd || !wd.matchups.length) continue;
      const cs = calcCatStats(wd.matchups, wd.stats);

      const groups = {};
      for (const m of wd.matchups) {
        if (!groups[m.matchup_id]) groups[m.matchup_id] = [];
        groups[m.matchup_id].push(m.roster_id);
      }
      for (const rids of Object.values(groups)) {
        if (rids.length < 2) continue;
        applyResult(st, cs, rids[0], rids[1]);
      }
      for (const { r1, r2 } of (dhData[w] || [])) applyResult(st, cs, r1, r2);
    }

    const cats = seasonCatTotals(rsWeek);
    const ranks = {};
    for (const c of BAFL_CATS) ranks[c.key] = rankMapFor(cats, c.key);
    const n = S.rosters.length;

    const sorted = Object.values(st).sort((a, b) => b.wins !== a.wins ? b.wins - a.wins : b.pf - a.pf);

    let rows = '';
    sorted.forEach((s, i) => {
      const cutoff = i === PLAYOFF_CUTOFF ? ' class="playoff-divider"' : '';
      const lbl    = i === PLAYOFF_CUTOFF ? '<span class="divider-lbl">Out of Playoffs</span>' : '';
      const catCells = BAFL_CATS.map(c => {
        const v = cats[s.rid][c.key] || 0;
        const rk = ranks[c.key][s.rid];
        return `<td class="s-cat ${heatClass(rk, n)}" title="${escAttr(`${c.label}: ${Math.round(v).toLocaleString()} — ${ordinal(rk)} in the league`)}">
          ${Math.round(v).toLocaleString()}</td>`;
      }).join('');
      rows += `<tr${cutoff}>
        <td class="s-rank">${i + 1}${i < PLAYOFF_CUTOFF ? ' 🏆' : ''}</td>
        <td class="s-team"><span class="team-link" onclick="openRosterModal(${s.rid})">${esc(s.name)}</span>${lbl}</td>
        <td class="s-rec"><span class="rec-w">${s.wins}</span>-<span class="rec-l">${s.losses}</span>${s.ties ? `-${s.ties}` : ''}</td>
        <td class="s-num s-pf">${fmtPts(s.pf)}</td>
        <td class="s-num">${fmtPts(s.pa)}</td>
        ${catCells}
      </tr>`;
    });

    const catHead = BAFL_CATS.map(c => `<th class="r s-cat-h">${c.label.slice(0, 4).toUpperCase()}</th>`).join('');
    setPage(`
      <div class="sec-head">Standings — Through Week ${rsWeek}
        <span class="sec-note">includes double headers</span></div>
      <div class="standings-wrap">
        <div class="table-scroll">
          <table class="stbl">
            <thead>
              <tr>
                <th>Rank</th><th>Team</th><th>Record</th>
                <th class="r">PF</th><th class="r">PA</th>
                ${catHead}
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>
      <div class="heat-legend">
        <span class="heat-legend-lbl">Category totals ranked league-wide</span>
        <span class="hm1">best</span><span class="hm2"></span><span class="hm3"></span><span class="hm4"></span><span class="hm5">worst</span>
      </div>`);
  } catch (e) {
    setError('Failed to calculate standings: ' + e.message);
  }
}
// ─── Render: Playoffs tab ────────────────────────────────────────────────────────
async function renderPlayoffs() {
  setLoading('Loading playoffs…');
  try {
    // Need regular-season data to compute seedings
    await loadAllWeeks();
    const dhData = await getDHMatchups();

    // --- Build regular-season standings for seeding ---
    const st = {};
    for (const r of S.rosters)
      st[r.roster_id] = { rid: r.roster_id, name: S.rosterMap[r.roster_id], wins:0, losses:0, ties:0, pf:0, pa:0 };
    const rsWeek = Math.min(S.currentWeek, REGULAR_SEASON_WEEKS);
    for (let w = 1; w <= rsWeek; w++) {
      const wd = S.weekCache[`${lid()}:${w}`];
      if (!wd || !wd.matchups.length) continue;
      const cs = calcCatStats(wd.matchups, wd.stats);
      const groups = {};
      for (const m of wd.matchups) {
        if (!groups[m.matchup_id]) groups[m.matchup_id] = [];
        groups[m.matchup_id].push(m.roster_id);
      }
      for (const rids of Object.values(groups)) {
        if (rids.length < 2) continue;
        applyResult(st, cs, rids[0], rids[1]);
      }
      for (const {r1, r2} of (dhData[w] || [])) applyResult(st, cs, r1, r2);
    }
    const seeds = Object.values(st)
      .sort((a,b) => b.wins !== a.wins ? b.wins - a.wins : b.pf - a.pf)
      .map((s, i) => ({ ...s, seed: i + 1 }));
    const byRid = {};
    seeds.forEach(s => byRid[s.rid] = s);

    if (S.currentWeek < 15) {
      setPage(`<div class="empty-box">Playoffs haven’t started yet — regular season ends after Week ${REGULAR_SEASON_WEEKS}.</div>`);
      return;
    }

    // Load playoff week data (fire all in parallel, ignore errors for future weeks)
    const [w15, w16, w17] = await Promise.all([15, 16, 17].map(w => loadWeek(w).catch(() => null)));

    // Helper: get category result for two roster IDs in a given week
    function matchResult(weekData, ridA, ridB) {
      if (!weekData) return null;
      const {matchups, stats} = weekData;
      const mA = matchups.find(m => m.roster_id === ridA);
      const mB = matchups.find(m => m.roster_id === ridB);
      if (!mA || !mB) return null;
      const cs = calcCatStats(
        [{roster_id:ridA,starters:mA.starters,players_points:mA.players_points||{}},
         {roster_id:ridB,starters:mB.starters,players_points:mB.players_points||{}}],
        stats
      );
      return calcResult(cs, ridA, ridB);
    }

    // Helper: render one bracket slot
    function slot(sd, winner, result, isSide) {
      if (!sd) return `<div class="bkt-slot tbd"><span class="bkt-seed">—</span><span class="bkt-name">TBD</span></div>`;
      const cls = result ? (winner === sd.rid ? ' bw' : ' bl') : '';
      const score = result
        ? (isSide
            ? (result.s1dec > result.s2dec ? result.s1dec : result.s2dec) // winner side
            : (result.s1dec < result.s2dec ? result.s1dec : result.s2dec) // loser side
          ) : '';
      const scoreCls = score ? ` class="bkt-score ${winner===sd.rid?'sw':''}"` : '';
      const scoreEl  = score !== '' ? `<span${scoreCls}>${result.tb1||result.tb2?score+'*':score}</span>` : '';
      return `<div class="bkt-slot${cls}" onclick="openRosterModal(${sd.rid})">
        <span class="bkt-seed">#${sd.seed}</span>
        <span class="bkt-name">${esc(sd.name)}</span>
        ${scoreEl}
      </div>`;
    }

    // Determine winner of a matchup
    function winner(ridA, ridB, result) {
      if (!result) return null;
      return result.s1dec > result.s2dec ? ridA : result.s2dec > result.s1dec ? ridB : null;
    }

    // --- CHAMPIONSHIP BRACKET (seeds 1-4) ---
    const s1=seeds[0],s2=seeds[1],s3=seeds[2],s4=seeds[3];
    const r_14 = matchResult(w15, s1.rid, s4.rid); // seed 1 vs 4
    const r_23 = matchResult(w15, s2.rid, s3.rid); // seed 2 vs 3
    const w_14 = winner(s1.rid, s4.rid, r_14);
    const w_23 = winner(s2.rid, s3.rid, r_23);
    const cFinA = w_14 ? byRid[w_14] : null;
    const cFinB = w_23 ? byRid[w_23] : null;
    const r_fin = cFinA && cFinB ? matchResult(w16, cFinA.rid, cFinB.rid) : null;
    const w_fin = cFinA && cFinB ? winner(cFinA.rid, cFinB.rid, r_fin) : null;
    const champ = w_fin ? byRid[w_fin] : null;

    // slot helpers bound to results
    const cSlot14 = (sd) => slot(sd, w_14, r_14, sd?.rid===w_14);
    const cSlot23 = (sd) => slot(sd, w_23, r_23, sd?.rid===w_23);
    const cSlotFin= (sd) => slot(sd, w_fin, r_fin, sd?.rid===w_fin);

    const champHTML = `
    <div class="playoff-section">
      <div class="playoff-section-title">🏆 Championship Bracket</div>
      <div class="bkt-scroll"><div class="bkt-grid">
        <div class="bkt-col">
          <div class="bkt-col-lbl">Semifinals — Wk 15</div>
          <div class="bkt-pair">${cSlot14(s1)}${cSlot14(s4)}</div>
          <div class="bkt-pair">${cSlot23(s2)}${cSlot23(s3)}</div>
        </div>
        <div class="bkt-col">
          <div class="bkt-col-lbl">Final — Wk 16</div>
          <div style="display:flex;flex-direction:column;justify-content:center;height:100%;padding:6px 0">
            <div class="bkt-single">${cSlotFin(cFinA)}${cSlotFin(cFinB)}</div>
          </div>
        </div>
        <div class="bkt-champ-col">
          <div class="bkt-champ-card">
            <span class="bkt-champ-icon">🏆</span>
            <div class="bkt-champ-lbl">Champion</div>
            <div class="bkt-champ-name">${champ ? esc(champ.name) : '?'}</div>
            <div class="bkt-champ-seed">${champ ? `#${champ.seed} seed` : 'Season in progress'}</div>
          </div>
        </div>
      </div></div>
    </div>`;

    // --- TOILET BOWL (seeds 5-10) ---
    const s5=seeds[4],s6=seeds[5],s7=seeds[6],s8=seeds[7],s9=seeds[8],s10=seeds[9];
    // Week 15: 7v10, 8v9 (seeds 5,6 have byes)
    const r_710  = matchResult(w15, s7.rid, s10.rid);
    const r_89   = matchResult(w15, s8.rid, s9.rid);
    const w_710  = winner(s7.rid, s10.rid, r_710);
    const w_89   = winner(s8.rid, s9.rid, r_89);
    // Week 16: 5 vs winner(7v10), 6 vs winner(8v9)
    const tb16A  = w_710 ? byRid[w_710] : null;
    const tb16B  = w_89  ? byRid[w_89]  : null;
    const r_5tb  = tb16A ? matchResult(w16, s5.rid, tb16A.rid) : null;
    const r_6tb  = tb16B ? matchResult(w16, s6.rid, tb16B.rid) : null;
    const w_5tb  = tb16A ? winner(s5.rid, tb16A.rid, r_5tb) : null;
    const w_6tb  = tb16B ? winner(s6.rid, tb16B.rid, r_6tb) : null;
    // Week 17 final
    const tf17A  = w_5tb ? byRid[w_5tb] : null;
    const tf17B  = w_6tb ? byRid[w_6tb] : null;
    const r_tfin = tf17A && tf17B ? matchResult(w17, tf17A.rid, tf17B.rid) : null;
    const w_tfin = tf17A && tf17B ? winner(tf17A.rid, tf17B.rid, r_tfin) : null;
    const tbWinner = w_tfin ? byRid[w_tfin] : null;

    const ts710 = (sd) => slot(sd, w_710,  r_710,  sd?.rid===w_710);
    const ts89  = (sd) => slot(sd, w_89,   r_89,   sd?.rid===w_89);
    const ts5tb = (sd) => slot(sd, w_5tb,  r_5tb,  sd?.rid===w_5tb);
    const ts6tb = (sd) => slot(sd, w_6tb,  r_6tb,  sd?.rid===w_6tb);
    const tsFin = (sd) => slot(sd, w_tfin, r_tfin, sd?.rid===w_tfin);

    const toiletHTML = `
    <div class="playoff-section">
      <div class="playoff-section-title">🚽 Toilet Bowl</div>
      <div class="bkt-scroll"><div class="bkt-grid">
        <div class="bkt-col">
          <div class="bkt-col-lbl">First Round — Wk 15</div>
          <div class="bkt-bye-row">#5 ${esc(s5.name)} — bye</div>
          <div class="bkt-pair">${ts710(s7)}${ts710(s10)}</div>
          <div class="bkt-bye-row">#6 ${esc(s6.name)} — bye</div>
          <div class="bkt-pair">${ts89(s8)}${ts89(s9)}</div>
        </div>
        <div class="bkt-col">
          <div class="bkt-col-lbl">Semifinals — Wk 16</div>
          <div class="bkt-pair" style="margin-top:12px">${ts5tb(s5)}${ts5tb(tb16A)}</div>
          <div class="bkt-pair" style="margin-top:12px">${ts6tb(s6)}${ts6tb(tb16B)}</div>
        </div>
        <div class="bkt-col">
          <div class="bkt-col-lbl">Final — Wk 17</div>
          <div style="display:flex;flex-direction:column;justify-content:center;height:100%;padding:6px 0">
            <div class="bkt-single">${tsFin(tf17A)}${tsFin(tf17B)}</div>
          </div>
        </div>
        <div class="bkt-champ-col">
          <div class="bkt-champ-card" style="border-color:var(--danger);background:rgba(248,81,73,.07)">
            <span class="bkt-champ-icon">🚽</span>
            <div class="bkt-champ-lbl" style="color:var(--danger)">Toilet Bowl Champ</div>
            <div class="bkt-champ-name">${tbWinner ? esc(tbWinner.name) : '?'}</div>
            <div class="bkt-champ-seed">${tbWinner ? `#${tbWinner.seed} seed` : 'Season in progress'}</div>
          </div>
        </div>
      </div></div>
    </div>`;

    setPage(`<div class="playoff-wrap">${champHTML}${toiletHTML}</div>`);
  } catch(e) {
    setError('Failed to load playoffs: ' + e.message);
  }
}

// Apply a single matchup result to the standings object
function applyResult(st, cs, rid1, rid2) {
  if (!st[rid1] || !st[rid2]) return;
  const r = calcResult(cs, rid1, rid2);
  st[rid1].pf += r.s1dec; st[rid1].pa += r.s2dec;
  st[rid2].pf += r.s2dec; st[rid2].pa += r.s1dec;
  if (r.s1dec > r.s2dec)      { st[rid1].wins++;  st[rid2].losses++; }
  else if (r.s2dec > r.s1dec) { st[rid2].wins++;  st[rid1].losses++; }
  else                         { st[rid1].ties++;  st[rid2].ties++;   }
}

// ─── Render: Leaders tab ──────────────────────────────────────────────────
// Two views over the same loaded data. TEAMS is the original league-wide category race.
// PLAYERS is new: which individual players actually produced those totals. It costs no extra
// network at all — the weekly matchups and stats needed to build it are already in the cache
// the standings put there, so it's a second pass over data we've paid for.
let leadersMode = 'teams';

const LEADER_SECTIONS = [
  { key: 'passing',   label: 'Passing Leaders',       unit: 'yds' },
  { key: 'receiving', label: 'Receiving Leaders',     unit: 'yds' },
  { key: 'rushing',   label: 'Rushing Leaders',       unit: 'yds' },
  { key: 'tds',       label: 'Touchdown Leaders',     unit: 'TDs' },
  { key: 'kicking',   label: 'Kicking Leaders',       unit: 'pts' },
  { key: 'yardage',   label: 'Total Yardage Leaders', unit: 'yds' },
];
const fmtLeaderVal = (v, unit) =>
  (unit === 'TDs' ? v.toFixed(0) : Math.round(v).toLocaleString()) + ' ' + unit;

function setLeadersMode(mode) {
  if (leadersMode === mode) return;
  leadersMode = mode;
  renderLeaders();
}
function leadersModeBar(rsWeek) {
  const btn = (m, label) =>
    `<button class="seg-btn ${leadersMode === m ? 'active' : ''}" onclick="setLeadersMode('${m}')">${label}</button>`;
  return `<div class="sec-head">League Leaders — Through Week ${rsWeek}
      <span class="seg">${btn('teams', 'Teams')}${btn('players', 'Players')}</span>
    </div>`;
}

async function renderLeaders() {
  if (!S.seasonStarted) return preDraftNotice();
  const rsWeek = Math.min(S.currentWeek, REGULAR_SEASON_WEEKS);
  setLoading('Calculating leaders…', `Loading weeks 1–${rsWeek}…`);
  try {
    await loadAllWeeks((done, total) => {
      const el = document.querySelector('.loading-sub');
      if (el) el.textContent = `Loaded ${done} / ${total} weeks…`;
    });
    if (leadersMode === 'players') await renderPlayerLeaders(rsWeek);
    else renderTeamLeaders(rsWeek);
  } catch (e) {
    setError('Failed to calculate leaders: ' + e.message);
  }
}

function renderTeamLeaders(rsWeek) {
  const totals = {};
  for (const r of S.rosters) {
    totals[r.roster_id] = { passing: 0, rushing: 0, receiving: 0, tds: 0, kicking: 0, yardage: 0 };
  }
  for (let w = 1; w <= rsWeek; w++) {
    const wd = S.weekCache[`${lid()}:${w}`];
    if (!wd || !wd.matchups.length) continue;
    const cs = calcCatStats(wd.matchups, wd.stats);
    for (const r of S.rosters) {
      const rid = r.roster_id, t = totals[rid];
      t.passing   += cs.passing[rid]   || 0;
      t.rushing   += cs.rushing[rid]   || 0;
      t.receiving += cs.receiving[rid] || 0;
      t.tds       += cs.tds[rid]       || 0;
      t.kicking   += cs.kicking[rid]   || 0;
      t.yardage   += (cs.passing[rid] || 0) + (cs.rushing[rid] || 0) + (cs.receiving[rid] || 0);
    }
  }

  let html = leadersModeBar(rsWeek) + '<div class="leaders-grid">';
  for (const { key, label, unit } of LEADER_SECTIONS) {
    const sorted = Object.entries(totals).sort((a, b) => b[1][key] - a[1][key]).slice(0, 5);
    html += `<div class="lcard"><div class="lcard-title">${label}</div>`;
    sorted.forEach(([rid, vals], i) => {
      const name = S.rosterMap[parseInt(rid)] || `Team ${rid}`;
      html += `<div class="lrow">
        <span class="lrank ${i < 3 ? `r${i + 1}` : ''}">${i + 1}</span>
        <span class="lname"><span class="team-link" onclick="openRosterModal(${parseInt(rid)})">${esc(name)}</span></span>
        <span class="lval">${fmtLeaderVal(vals[key], unit)}</span>
      </div>`;
    });
    html += '</div>';
  }
  setPage(html + '</div>');
}

// Per-player season totals, accumulated only from weeks in which a BAFL team STARTED them —
// which is the only production that counted for anything in this league. Bench weeks are
// deliberately excluded; a 200-yard game on someone's bench won no categories.
function accumulatePlayerTotals(rsWeek) {
  const tot = {};   // pid → {passing,…, yardage, games, startedBy:Set}
  for (let w = 1; w <= rsWeek; w++) {
    const wd = S.weekCache[`${lid()}:${w}`];
    if (!wd || !wd.matchups.length) continue;
    for (const m of wd.matchups) {
      const pp = m.players_points || {};
      for (const pid of (m.starters || [])) {
        if (!(pid in pp)) continue;   // same "did not participate" rule as the matchup math
        const c = baflPlayerCats(wd.stats[pid]);
        const t = tot[pid] || (tot[pid] = {
          passing: 0, rushing: 0, receiving: 0, tds: 0, kicking: 0, yardage: 0,
          games: 0, startedBy: new Set(),
        });
        t.passing += c.passing; t.rushing += c.rushing; t.receiving += c.receiving;
        t.tds += c.tds; t.kicking += c.kicking;
        t.yardage += baflTotalYards(c);
        t.games++;
        t.startedBy.add(m.roster_id);
      }
    }
  }
  return tot;
}

async function renderPlayerLeaders(rsWeek) {
  const players = await loadPlayers().catch(() => ({}));
  const tot = accumulatePlayerTotals(rsWeek);
  if (!Object.keys(tot).length) {
    setPage(leadersModeBar(rsWeek) + '<div class="empty-box">No started-player data yet this season.</div>');
    return;
  }

  let html = leadersModeBar(rsWeek) +
    `<div class="leaders-note">Totals count only the weeks a BAFL team started the player — bench
      production never won a category.</div><div class="leaders-grid">`;

  for (const { key, label, unit } of LEADER_SECTIONS) {
    const sorted = Object.entries(tot)
      .filter(([, v]) => v[key] > 0)
      .sort((a, b) => b[1][key] - a[1][key])
      .slice(0, 6);
    html += `<div class="lcard"><div class="lcard-title">${label}</div>`;
    if (!sorted.length) html += `<div class="lrow lrow-empty">No production yet</div>`;
    sorted.forEach(([pid, v], i) => {
      const p = players[pid] || {};
      const pos = (p.pos || '?').toUpperCase();
      const own = ownerOf(pid);
      // Whoever started him most is the meaningful attribution over a season; his current
      // owner may have picked him up last week.
      const ownTag = own ? `<span class="lowner">${esc(own.name)}</span>` : '';
      html += `<div class="lrow lrow-player" onclick="openPlayerCard(${jsArg(pid)})" role="button" tabindex="0">
        <span class="lrank ${i < 3 ? `r${i + 1}` : ''}">${i + 1}</span>
        ${headshotImg(pid, p, 'lhs', (p.name || '?')[0])}
        <div class="lname-block">
          <span class="lname">${esc(p.name || pid)}</span>
          <span class="lsub"><span class="pos-badge pos-${esc(pos)}">${esc(pos)}</span>${ownTag}
            <span class="lgames">${v.games}g</span></span>
        </div>
        <span class="lval">${fmtLeaderVal(v[key], unit)}</span>
      </div>`;
    });
    html += '</div>';
  }
  setPage(html + '</div>');
}
// ─── Swipe between tabs ───────────────────────────────────────────────────
// Ported from TripleCrown. The gesture itself is trivial; knowing when NOT to fire is the
// whole job:
//   • horizontal scrollers (the standings grid, a game-log table, the bracket) must win — a
//     swipe that starts inside one is the user scrolling it, not changing tabs;
//   • vertical scrolling must never be hijacked, so the axis is decided before we commit;
//   • once we do commit we claim the gesture with preventDefault, or the browser keeps running
//     pull-to-refresh and back-swipe underneath it;
//   • the iOS left-edge back-swipe can't be reliably cancelled, so we don't engage there at
//     all rather than fighting it and feeling broken.
const TS_COMMIT = 60;   // px of horizontal travel before a tab change commits
const TS_DECIDE = 10;   // px before we decide the gesture's axis
const TS_EDGE   = 24;   // ignore starts this close to the left edge (iOS back-swipe zone)

function tsTabs() { return Array.from(document.querySelectorAll('.tabs .tab')); }

function tsGo(dir) {
  const tabs = tsTabs();
  const i = tabs.findIndex(t => t.classList.contains('active'));
  const next = tabs[i + dir];
  if (!next) return;
  next.click();
}

(function wireTabSwipe() {
  let x0 = null, y0 = null, axis = null, active = false;

  document.addEventListener('touchstart', e => {
    axis = null; active = false; x0 = null;
    if (e.touches.length !== 1) return;
    // Any layer above the page owns its own gestures.
    if (PC || psOpen) return;
    if (document.getElementById('rosterOverlay')?.classList.contains('active')) return;
    const t = e.touches[0];
    if (t.clientX <= TS_EDGE) return;                 // iOS back-swipe zone
    // A swipe beginning inside something that scrolls sideways belongs to that element.
    if (e.target.closest && e.target.closest('.table-scroll,.bkt-scroll,.pc-table-scroll,.mc-table-scroll,.tabs')) return;
    x0 = t.clientX; y0 = t.clientY; active = true;
  }, { passive: true });

  document.addEventListener('touchmove', e => {
    if (!active || x0 == null) return;
    const dx = e.touches[0].clientX - x0;
    const dy = e.touches[0].clientY - y0;
    if (axis === null) {
      if (Math.abs(dx) < TS_DECIDE && Math.abs(dy) < TS_DECIDE) return;
      axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      if (axis === 'y') { active = false; return; }   // vertical scroll is never ours
    }
    if (axis === 'x' && e.cancelable) e.preventDefault();
  }, { passive: false });

  document.addEventListener('touchend', e => {
    if (!active || axis !== 'x' || x0 == null) { active = false; return; }
    const dx = (e.changedTouches[0] || {}).clientX - x0;
    active = false;
    if (Math.abs(dx) < TS_COMMIT) return;
    tsGo(dx < 0 ? 1 : -1);   // swipe left → next tab
  }, { passive: true });
})();
// ─── Page-state helpers ───────────────────────────────────────────────────
function setPage(html) {
  document.getElementById('page').innerHTML = html;
}
function setLoading(msg, sub) {
  document.getElementById('page').innerHTML = `
    <div class="loading">
      <div class="spin"></div>
      <div class="loading-label">${esc(msg)}</div>
      ${sub ? `<div class="loading-sub">${esc(sub)}</div>` : ''}
    </div>`;
}
function setError(msg) {
  document.getElementById('page').innerHTML = `<div class="error-box">⚠ ${esc(msg)}</div>`;
}
// Every tab renders nothing useful before the schedule exists, so they all share this guard.
function preDraftNotice() {
  setPage('<div class="empty-box">This season hasn’t started yet. Check back after the draft!</div>');
}
// ─── Service worker ───────────────────────────────────────────────────────
// Registered last and entirely optional: it caches the app shell so a reload (or a flaky
// connection at the stadium) opens instantly. Live league data is never cached by it — see
// sw.js, which deliberately leaves every api.sleeper.* request alone.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => { /* file:// or unsupported */ });
  });
}

// ─── Start ────────────────────────────────────────────────────────────────
init();
</script>
