// ─── Data loading ─────────────────────────────────────────────────────────
async function loadWeek(week) {
  const key = `${lid()}:${week}`;
  if (S.weekCache[key]) return S.weekCache[key];
  const season = S.league.season;
  const [matchups, stats] = await Promise.all([
    fetchJ(`${API}/league/${lid()}/matchups/${week}`),
    fetchJ(`${API}/stats/nfl/regular/${season}/${week}`),
  ]);
  S.weekCache[key] = { matchups: matchups || [], stats: stats || {} };
  return S.weekCache[key];
}

async function loadAllWeeks(onProgress) {
  if (S.allLoadedFor === lid()) return;
  // Only load the 14 regular-season weeks — playoff weeks are not counted in standings/leaders
  const maxWeek = Math.min(S.currentWeek, REGULAR_SEASON_WEEKS);
  const weeks = Array.from({length: maxWeek}, (_, i) => i + 1);
  const BATCH = 4;
  for (let i = 0; i < weeks.length; i += BATCH) {
    const chunk = weeks.slice(i, i + BATCH);
    await Promise.all(chunk.map(w => loadWeek(w).catch(() => null)));
    if (onProgress) onProgress(Math.min(i + BATCH, weeks.length), weeks.length);
  }
  S.allLoadedFor = lid();
}

// Load matchup structure only (no stats) — used for DH computation
async function loadSchedule(week) {
  const fullKey = `${lid()}:${week}`;
  if (S.weekCache[fullKey]) return S.weekCache[fullKey].matchups;
  const sKey = `${lid()}:sched:${week}`;
  if (S.schedCache[sKey]) return S.schedCache[sKey];
  const m = await fetchJ(`${API}/league/${lid()}/matchups/${week}`).catch(() => []);
  S.schedCache[sKey] = m || [];
  return S.schedCache[sKey];
}

// Deterministically compute which teams need a double header each DH week.
// Algorithm:
//   1. Fetch the full 14-week schedule to count how often each pair plays.
//   2. Pairs that play only once are the "missing" matchups.
//   3. Sort missing pairs by (lower_rid ASC, higher_rid ASC) for stability.
//   4. Chunk evenly into DH_WEEKS in order.
// Compute DH matchups by finding "source weeks" - regular-season weeks
// whose matchups are all once-only pairs - then assigning them to DH weeks.
// Pattern verified against 2025 double_headers.json:
//   source weeks [6,7,8,9], DH weeks [2,3,13,14]
//   lower half source -> upper DH:  6->13, 7->14
//   upper half source -> lower DH:  8->2,  9->3
async function getDHMatchups() {
  if (S.dhMatchups !== null) return S.dhMatchups;
  if (!S.seasonStarted) { S.dhMatchups = {}; return S.dhMatchups; }

  // Use exact historical data when available (keyed by season year, e.g. "2025")
  // Add entries to double_headers.json to lock in accurate data for past seasons.
  const histExact = S.dhHistory[String(S.league.season)];
  if (histExact) {
    S.dhMatchups = {};
    for (const [wk, pairs] of Object.entries(histExact)) {
      S.dhMatchups[parseInt(wk)] = pairs;
    }
    return S.dhMatchups;
  }

  const allMatchups = await Promise.all(
    Array.from({length: REGULAR_SEASON_WEEKS}, (_, i) => loadSchedule(i + 1))
  );

  // Count how many times each pair plays and record pairs per week
  const pairCount = {};
  const weekPairs = [];

  for (let wi = 0; wi < REGULAR_SEASON_WEEKS; wi++) {
    const matchups = allMatchups[wi];
    const pairs = [];
    const groups = {};
    for (const m of matchups) {
      if (!groups[m.matchup_id]) groups[m.matchup_id] = [];
      groups[m.matchup_id].push(m.roster_id);
    }
    for (const rids of Object.values(groups)) {
      if (rids.length < 2) continue;
      const lo = Math.min(...rids), hi = Math.max(...rids);
      const key = `${lo}:${hi}`;
      pairCount[key] = (pairCount[key] || 0) + 1;
      pairs.push({ lo, hi, key });
    }
    weekPairs.push(pairs);
  }

  // Once-only pairs: teams that play each other only once in the regular season
  const oncePairs = new Set(
    Object.entries(pairCount).filter(([, c]) => c === 1).map(([k]) => k)
  );

  // Source weeks: regular-season weeks where every matchup is a once-only pair.
  // These are used as the DH opponent templates.
  const sourceWeeks = weekPairs
    .map((pairs, wi) => ({ week: wi + 1, pairs }))
    .filter(({ pairs }) => pairs.length === 5 && pairs.every(p => oncePairs.has(p.key)))
    .sort((a, b) => a.week - b.week);

  const sortedDHWeeks = [...DH_WEEKS].sort((a, b) => a - b);
  const dh = {};

  if (sourceWeeks.length === DH_WEEKS.length) {
    // Interleave: lower source weeks -> upper DH weeks; upper source -> lower DH weeks
    const n = sourceWeeks.length;
    const half = Math.floor(n / 2);
    for (let i = 0; i < n; i++) {
      const dhIdx = i < half ? i + half : i - half;
      const dhWk  = sortedDHWeeks[dhIdx];
      dh[dhWk] = sourceWeeks[i].pairs
        .sort((a, b) => a.lo - b.lo || a.hi - b.hi)
        .map(({ lo, hi }) => ({ r1: lo, r2: hi }));
    }
  } else {
    // Fallback: backtracking perfect matching
    let remaining = [...oncePairs]
      .map(k => k.split(':').map(Number))
      .sort((a, b) => a[0] !== b[0] ? a[0] - b[0] : a[1] - b[1]);
    for (const wk of sortedDHWeeks) {
      const matching = findPerfectMatching(remaining);
      const usedSet  = new Set(matching.map(([a,b]) => `${a}:${b}`));
      dh[wk]    = matching.sort((a,b) => a[0]-b[0]||a[1]-b[1]).map(([r1,r2]) => ({r1,r2}));
      remaining = remaining.filter(([a,b]) => !usedSet.has(`${a}:${b}`));
    }
  }

  S.dhMatchups = dh;
  return dh;
}
function findPerfectMatching(edges) {
  if (!edges.length) return [];
  const verts = [...new Set(edges.flatMap(([a,b]) => [a,b]))].sort((a,b) => a-b);
  const result = [];
  const used   = new Set();
  function bt(el) {
    let pivot = -1;
    for (const v of verts) { if (!used.has(v)) { pivot = v; break; } }
    if (pivot === -1) return true;
    for (const [a, b] of el) {
      if (used.has(a) || used.has(b) || (a !== pivot && b !== pivot)) continue;
      used.add(a); used.add(b);
      result.push([Math.min(a,b), Math.max(a,b)]);
      if (bt(el.filter(([x,y]) => !used.has(x) && !used.has(y)))) return true;
      result.pop(); used.delete(a); used.delete(b);
    }
    return false;
  }
  bt(edges);
  return result;
}


// ─── NFL player database ──────────────────────────────────────────────────
// Sleeper's player dictionary is the single largest thing this app downloads — roughly 10MB
// of JSON covering every player it has ever known. The old code fetched it in full on the
// first roster-modal open of every session and held the raw object in memory.
//
// Two changes here:
//   1. SLIM IT. We keep ~12 fields per player out of the ~40 Sleeper sends; the retained
//      object is a small fraction of the original, which matters on a phone where the raw
//      parse is the peak memory moment of the session.
//   2. PERSIST IT. The slim dict goes into Cache Storage under a day-stamped key, so the
//      second visit (and every roster open after a reload) is a local read instead of a 10MB
//      download. Rosters change daily at most, so a 1-day TTL is not a meaningful staleness
//      risk — and a stale hit still beats no data.
const PLAYERS_CACHE = 'bafl-players-v1';
const PLAYERS_TTL_MS = 24 * 60 * 60 * 1000;

function slimPlayers(raw) {
  const slim = {};
  for (const pid in raw) {
    const p = raw[pid];
    // Team defenses have no person behind them and never appear in a BAFL starting lineup
    // as a scoring category — skip them rather than carry 32 stub records.
    if (!p || !p.position || p.position === 'DEF') continue;
    slim[pid] = {
      player_id: pid,
      name: p.full_name || `${p.first_name || ''} ${p.last_name || ''}`.trim(),
      first_name: p.first_name || '',
      last_name: p.last_name || '',
      pos: p.position,
      team: p.team || null,
      age: p.age != null ? p.age : null,
      years_exp: p.years_exp != null ? p.years_exp : null,
      height: p.height || null,
      weight: p.weight || null,
      college: p.college || null,
      number: p.number != null ? p.number : null,
      espn_id: p.espn_id != null ? String(p.espn_id) : null,
    };
  }
  return slim;
}

// Cache Storage rather than localStorage: localStorage is a synchronous ~5MB-quota store and
// this payload would either blow the quota or block the main thread writing it.
async function readPlayersCache() {
  try {
    if (!('caches' in window)) return null;
    const c = await caches.open(PLAYERS_CACHE);
    const hit = await c.match('players');
    if (!hit) return null;
    const stamp = Number(hit.headers.get('x-bafl-cached-at') || 0);
    if (!stamp || Date.now() - stamp > PLAYERS_TTL_MS) return null;
    return await hit.json();
  } catch { return null; }
}
async function writePlayersCache(slim) {
  try {
    if (!('caches' in window)) return;
    const c = await caches.open(PLAYERS_CACHE);
    await c.put('players', new Response(JSON.stringify(slim), {
      headers: { 'Content-Type': 'application/json', 'x-bafl-cached-at': String(Date.now()) },
    }));
  } catch { /* quota or private mode — the in-memory copy still works this session */ }
}

async function loadPlayers() {
  if (S.playersCache) return S.playersCache;
  if (S.playersPromise) return S.playersPromise;   // a load is already running — share it
  S.playersPromise = (async () => {
    const cached = await readPlayersCache();
    if (cached) { S.playersCache = cached; return cached; }
    const raw = await fetchJ(SLEEPER_PLAYERS_URL);
    const slim = slimPlayers(raw);
    S.playersCache = slim;
    writePlayersCache(slim);   // fire-and-forget; nothing waits on the write
    return slim;
  })();
  try {
    return await S.playersPromise;
  } catch (e) {
    S.playersPromise = null;   // clear so a later attempt can retry
    throw e;
  }
}

function playerRec(pid) {
  return (S.playersCache && S.playersCache[String(pid)]) || null;
}
function playerName(pid) {
  const p = playerRec(pid);
  return (p && p.name) || String(pid);
}

// ─── Ownership index ──────────────────────────────────────────────────────
// pid → roster_id for every rostered player in the season being viewed. Rebuilt whenever the
// season loads. This is what lets a player card, or a search result, say who owns him.
function buildOwnerIndex() {
  const idx = {};
  for (const r of S.rosters) {
    for (const pid of (r.players || [])) idx[String(pid)] = r.roster_id;
  }
  S.ownerByPid = idx;
}
function ownerOf(pid) {
  const rid = S.ownerByPid && S.ownerByPid[String(pid)];
  return rid ? { rid, name: S.rosterMap[rid] || `Team ${rid}` } : null;
}

// ─── Season eligibility ───────────────────────────────────────────────────
// Which NFL seasons is it worth offering a tab for? Sleeper carries `years_exp`, so a player's
// rookie year is (current season − years_exp). That's a candidate list, not a guarantee —
// years_exp is wrong or missing often enough that the card also treats an empty stats response
// as "no games that year" and greys the tab out. Deriving the list up front means the tabs
// render instantly; verifying lazily means a bad years_exp self-corrects on first click.
async function currentNflSeason() {
  if (S.nflSeason) return S.nflSeason;
  const st = await fetchSoft(SLEEPER_STATE_URL);
  const yr = st && (st.season || st.league_season);
  // Fall back to the league we're viewing rather than the wall clock — in January the calendar
  // year has already rolled over but the NFL season being played has not.
  S.nflSeason = Number(yr) || Number(S.league && S.league.season) || new Date().getFullYear();
  return S.nflSeason;
}
async function eligibleSeasons(pid) {
  const cur = await currentNflSeason();
  const p = playerRec(pid);
  const exp = p && Number.isFinite(Number(p.years_exp)) ? Number(p.years_exp) : null;
  // No years_exp at all → offer a conservative recent window rather than nothing.
  const first = exp == null ? cur - 4 : cur - exp;
  const start = Math.max(EARLIEST_STAT_SEASON, Math.min(first, cur));
  const out = [];
  for (let y = cur; y >= start; y--) out.push(String(y));
  return out;
}
// ─── Roster modal ─────────────────────────────────────────────────────────
// Click a team name anywhere and this shows its lineup for the selected week: starters first,
// then the bench, each with the week's stat line. Every row opens that player's card.
const POS_ORDER = { QB: 0, RB: 1, WR: 2, TE: 3, K: 4 };

async function openRosterModal(rid) {
  const overlay = document.getElementById('rosterOverlay');
  const titleEl = document.getElementById('rosterModalTitle');
  const body    = document.getElementById('rosterModalBody');

  titleEl.textContent = S.rosterMap[rid] || `Team ${rid}`;
  body.innerHTML = '<div class="loading"><div class="spin"></div><div>Loading roster…</div></div>';
  overlay.classList.add('active');
  pcLockPage(true);

  try {
    const roster = S.rosters.find(r => r.roster_id === rid);
    if (!roster) { body.innerHTML = '<div class="empty-box">Roster not found.</div>'; return; }

    // Starters and weekly stats for the currently-selected week.
    const weekData  = S.weekCache[`${lid()}:${S.selectedWeek}`];
    const weekEntry = weekData?.matchups?.find(m => m.roster_id === rid);
    const starters  = new Set(weekEntry?.starters || []);
    const weekStats = weekData?.stats || {};
    const playedIn  = weekEntry?.players_points || {};

    const players   = await loadPlayers();
    const playerIds = roster.players || [];

    const sorted = playerIds
      .map(pid => ({ pid, p: players[pid] || {} }))
      .filter(({ p }) => p.last_name || p.name)
      .sort((a, b) => {
        const aS = starters.has(a.pid) ? 0 : 1;
        const bS = starters.has(b.pid) ? 0 : 1;
        if (aS !== bS) return aS - bS;
        const aO = POS_ORDER[a.p.pos] ?? 9;
        const bO = POS_ORDER[b.p.pos] ?? 9;
        if (aO !== bO) return aO - bO;
        return (a.p.name || '').localeCompare(b.p.name || '');
      });

    const starterList = sorted.filter(({ pid }) => starters.has(pid));
    const benchList   = sorted.filter(({ pid }) => !starters.has(pid));

    const hasStats = Object.keys(weekStats).length > 0;
    let html = '';
    if (starterList.length) {
      const wkLabel = hasStats ? `Week ${S.selectedWeek}` : `Week ${S.selectedWeek} (no stats yet)`;
      html += `<div class="roster-sec-head">Starting Lineup — ${wkLabel}</div>`;
      // What this lineup actually produced in each BAFL category — the number the matchup is
      // decided on, broken out before the individual lines that add up to it.
      if (hasStats) html += lineupCatSummary(starterList, weekStats, playedIn);
      html += starterList.map(({ pid, p }) => playerRowHTML(pid, p, true, weekStats[pid])).join('');
    }
    if (benchList.length) {
      html += `<div class="roster-sec-head">Bench</div>`;
      html += benchList.map(({ pid, p }) => playerRowHTML(pid, p, false, weekStats[pid])).join('');
    }
    if (!html) html = '<div class="empty-box">No players found.</div>';
    body.innerHTML = html;
  } catch (e) {
    body.innerHTML = `<div class="error-box">⚠ ${esc(e.message)}</div>`;
  }
}

// Per-category totals for the starting lineup shown. Mirrors calcCatStats exactly (including
// the "player did not participate" check) so this can never disagree with the matchup card.
function lineupCatSummary(starterList, weekStats, playedIn) {
  const tot = { passing: 0, rushing: 0, receiving: 0, tds: 0, kicking: 0 };
  for (const { pid } of starterList) {
    if (!(pid in playedIn)) continue;
    const c = baflPlayerCats(weekStats[pid]);
    for (const k in tot) tot[k] += c[k];
  }
  const chips = BAFL_CATS.map(c =>
    `<div class="lcs-chip"><span class="lcs-lbl">${c.label}</span>` +
    `<span class="lcs-val">${Math.round(tot[c.key])}</span></div>`).join('');
  return `<div class="lineup-cat-summary">${chips}
    <div class="lcs-chip lcs-total"><span class="lcs-lbl">Total Yds</span>
      <span class="lcs-val">${Math.round(baflTotalYards(tot))}</span></div>
  </div>`;
}

function playerRowHTML(pid, p, isStarter, ps) {
  const name = p.name || `${p.first_name || ''} ${p.last_name || ''}`.trim() || pid;
  const pos  = (p.pos || '?').toUpperCase();
  const team = p.team || '';
  const starterTag = isStarter ? '<span class="roster-starter-tag">STARTER</span>' : '';

  // Build a stat line from this week's stats, tuned to the position.
  let statLine = '';
  if (ps) {
    const parts = [];
    if (ps.pass_att) {
      parts.push(`${Math.round(ps.pass_yd || 0)}yd`);
      if (ps.pass_td)  parts.push(`${ps.pass_td}TD`);
      if (ps.pass_int) parts.push(`${ps.pass_int}INT`);
      if ((ps.rush_yd || 0) > 0) parts.push(`${Math.round(ps.rush_yd)}rush`);
    } else if ((ps.rush_att || 0) > 0 || (ps.rush_yd || 0) > 0) {
      parts.push(`${Math.round(ps.rush_yd || 0)}rush`);
      if (ps.rush_td) parts.push(`${ps.rush_td}TD`);
      if ((ps.rec_yd || 0) > 0) parts.push(`${ps.rec || 0}/${ps.rec_tgt || 0} ${Math.round(ps.rec_yd)}rec`);
    } else if ((ps.rec_tgt || 0) > 0 || (ps.rec_yd || 0) > 0) {
      parts.push(`${ps.rec || 0}/${ps.rec_tgt || 0} ${Math.round(ps.rec_yd || 0)}yd`);
      if (ps.rec_td) parts.push(`${ps.rec_td}TD`);
    } else if (pos === 'K') {
      if (ps.xpa !== undefined) parts.push(`${ps.xpm || 0}/${ps.xpa}XP`);
      if (ps.fga !== undefined) parts.push(`${ps.fgm || 0}/${ps.fga}FG`);
    }
    if (parts.length) statLine = `<span class="roster-player-stats">${esc(parts.join(' · '))}</span>`;
  }

  return `<div class="roster-player${isStarter ? ' starter' : ''} clickable" onclick="openPlayerCard(${jsArg(pid)})"
       role="button" tabindex="0" aria-label="${escAttr(`Open ${name} player card`)}">
    ${headshotImg(pid, p, 'roster-hs', (pos[0] || '?'))}
    <span class="pos-badge pos-${esc(pos)}">${esc(pos)}</span>
    <div class="roster-player-info">
      <span class="roster-player-name">${esc(name)}</span>
      <span class="roster-player-team">${esc(team)}${statLine}</span>
    </div>
    ${starterTag}
  </div>`;
}

function closeRosterModal() {
  document.getElementById('rosterOverlay').classList.remove('active');
  // Only release the page lock if a player card isn't still open on top of the modal.
  if (!PC) pcLockPage(false);
}

// Escape closes the topmost layer: the player card first, then the roster modal.
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (PC) return;   // the card's own handler takes this one
  closeRosterModal();
});
// ─── ESPN enrichment (draft info + college game logs) ─────────────────────
// Everything here is browser-reachable and needs no pre-baked data, which is the whole reason
// it survives the "no seed" constraint. Two things come from ESPN that Sleeper simply doesn't
// carry: where a player was drafted, and what he did in college. Both are optional — every
// lookup degrades to "show nothing" rather than failing the card.
const ESPN_SEARCH_URL   = q => `https://site.web.api.espn.com/apis/search/v2?query=${encodeURIComponent(q)}&limit=10`;
const ESPN_GAMELOG_URL  = (league, aid, season) =>
  `https://site.api.espn.com/apis/common/v3/sports/football/${league}/athletes/${aid}/gamelog${season ? `?season=${season}` : ''}`;
const ESPN_CORE_ATHLETE_URL = (season, aid) =>
  `https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/seasons/${season}/athletes/${aid}?lang=en&region=us`;

const ESPN_TEAM_ID = {ATL:1,BUF:2,CHI:3,CIN:4,CLE:5,DAL:6,DEN:7,DET:8,GB:9,TEN:10,
  IND:11,KC:12,LV:13,LAR:14,MIA:15,MIN:16,NE:17,NO:18,NYG:19,NYJ:20,PHI:21,ARI:22,
  PIT:23,LAC:24,SF:25,SEA:26,TB:27,WAS:28,CAR:29,JAX:30,BAL:33,HOU:34};
const ESPN_ID_TO_CODE = Object.fromEntries(Object.entries(ESPN_TEAM_ID).map(([c, i]) => [i, c]));

let espnAthleteIdCache = {};   // `${pid}:${league}` → athlete id ('' = looked up, none found)
let espnGamelogCache   = {};   // `${league}:${aid}:${season}` → gamelog json
let espnDraftCache     = {};   // aid → {year,round,selection,teamCode} | {undrafted} | null

// Search ESPN for an athlete id by name, preferring the wanted league (uid `~l:<id>~`:
// 28 = NFL, 23 = college). Falls back to the first player result so a last-resort lookup
// still resolves something.
async function searchEspnAthleteId(nm, wantLeagueId) {
  const s = await fetchSoft(ESPN_SEARCH_URL(nm));
  const results = (s && s.results) || [];
  let fallbackId = null;
  for (const r of results) {
    if (r.type !== 'player') continue;
    for (const it of (r.contents || [])) {
      const uid = it.uid || '';
      let m = /a:(\d+)/.exec(uid);
      if (!m) m = /\/id\/(\d+)\//.exec((it.link && it.link.web) || '');
      if (!m) continue;
      if (!fallbackId) fallbackId = m[1];
      const lm = /~l:(\d+)~/.exec(uid);
      if (lm && lm[1] === wantLeagueId) return m[1];
    }
  }
  return fallbackId;
}

// Resolve a player's ESPN athlete id. NFL: Sleeper's espn_id, else a name search. College:
// ESPN uses different ids per sport and a raw college name search often lands on a different
// same-named player, so we route through the NFL athlete record's authoritative
// `collegeAthlete` link and only name-search as a last resort.
async function resolveEspnAthleteId(pid, name, league) {
  const lg = league || 'nfl';
  const ck = `${pid}:${lg}`;
  if (espnAthleteIdCache[ck] != null) return espnAthleteIdCache[ck] || null;
  const p = playerRec(pid);
  const nm = name || (p && p.name) || '';
  if (lg === 'college-football') {
    const nflId = await resolveEspnAthleteId(pid, nm, 'nfl');
    if (nflId) {
      const season = await currentNflSeason();
      const core = await fetchSoft(ESPN_CORE_ATHLETE_URL(season, nflId));
      const cm = /\/athletes\/(\d+)/.exec((core && core.collegeAthlete && core.collegeAthlete.$ref) || '');
      if (cm) { espnAthleteIdCache[ck] = cm[1]; return cm[1]; }
    }
    const cid = nm ? await searchEspnAthleteId(nm, '23') : null;
    espnAthleteIdCache[ck] = cid || '';
    return cid || null;
  }
  if (p && p.espn_id) { espnAthleteIdCache[ck] = p.espn_id; return p.espn_id; }
  if (!nm) { espnAthleteIdCache[ck] = ''; return null; }
  const id = await searchEspnAthleteId(nm, '28');
  espnAthleteIdCache[ck] = id || '';
  return id || null;
}

async function fetchEspnGamelog(aid, league, season) {
  const key = `${league}:${aid}:${season || '_'}`;
  if (espnGamelogCache[key]) return espnGamelogCache[key];
  const data = await fetchJ(ESPN_GAMELOG_URL(league, aid, season));
  espnGamelogCache[key] = data;
  return data;
}

// Normalize ESPN's core-athlete `draft` object. {undrafted:true} means the record loaded but
// carries no draft (a real UDFA); null means the lookup itself failed — the difference matters,
// because one should render "Undrafted" and the other should render nothing at all.
function normalizeEspnDraft(d) {
  if (!d || typeof d !== 'object') return null;
  const dr = d.draft;
  if (!(dr && dr.year)) return { undrafted: true };
  const m = /\/teams\/(\d+)/.exec((dr.team && dr.team.$ref) || '');
  return {
    year: dr.year, round: dr.round, selection: dr.selection,
    teamCode: m ? (ESPN_ID_TO_CODE[parseInt(m[1])] || null) : null,
  };
}
async function fetchEspnDraftInfo(aid) {
  if (espnDraftCache[aid] !== undefined) return espnDraftCache[aid];
  const season = await currentNflSeason();
  const d = await fetchSoft(ESPN_CORE_ATHLETE_URL(season, aid));
  espnDraftCache[aid] = normalizeEspnDraft(d);
  return espnDraftCache[aid];
}
// Compact draft line for the card hero: "DRAFT 2021 · Rd 1, Pk 5 · CIN", or "Undrafted".
function espnDraftHero(info) {
  if (!info) return '';
  if (info.undrafted) {
    return `<span class="pc-draft-line"><span class="pc-draft-lbl">DRAFT</span><span class="muted">Undrafted</span></span>`;
  }
  const logo = info.teamCode
    ? `<img src="${NFL_LOGO(info.teamCode)}" class="pc-draft-logo" onerror="this.style.display='none'">` : '';
  const team = info.teamCode ? `<span class="pc-draft-team">${logo}${info.teamCode}</span>` : '';
  return `<span class="pc-draft-line"><span class="pc-draft-lbl">DRAFT</span>` +
    `<span>${info.year} · <span class="muted">Rd</span> ${info.round}, <span class="muted">Pk</span> ${info.selection}</span>${team}</span>`;
}

// ─── College gamelog rendering ────────────────────────────────────────────
// ESPN's gamelog payload is self-describing: it ships `labels`/`names` for whatever columns
// suit the player's position, so this renders whatever it's handed rather than hard-coding a
// schema per position.
function espnStatGroup(name) {
  const n = name || '';
  if (/^fieldGoal/i.test(n) || /^extraPoint/i.test(n) ||
      ['longFieldGoalMade','totalKickingPoints','kickExtraPoints'].includes(n)) return 'KICKING';
  if (/^punt/i.test(n) || ['grossAvgPuntYards','netAvgPuntYards','longPunt','touchbacks','puntsInside20'].includes(n)) return 'PUNTING';
  // yardsPerPassAttempt sits between CMP% and TD in ESPN's ordering, so leaving it unmatched
  // split the passing block into two groups with a stray gap in the middle.
  if (/^passing/.test(n) || ['completions','passingAttempts','completionPct','interceptions',
      'interceptionPct','longPassing','sacks','sackYardsLost','QBRating','adjQBR','ESPNQBRating',
      'yardsPerPassAttempt','avgGain','quarterbackRating','totalQBRating'].includes(n)) return 'PASSING';
  if (/^rushing/.test(n) || ['yardsPerRushAttempt','longRushing'].includes(n)) return 'RUSHING';
  if (/^receiving/.test(n) || ['receptions','yardsPerReception','longReception'].includes(n)) return 'RECEIVING';
  if (/^(totalTackles|soloTackles|assistTackles)$/.test(n)) return 'TACKLES';
  if (/^(passesDefended|interceptionYards|interceptionTouchdowns)$/.test(n)) return 'COVERAGE';
  if (/fumble/i.test(n)) return 'FUM';
  return 'MISC';
}
function espnColor(name, v) {
  if (v == null) return '';
  switch (name) {
    case 'receptions':            return triHigh(v, 6, 4);
    case 'receivingYards':        return triHigh(v, 80, 50);
    case 'yardsPerReception':     return triHigh(v, 14, 10);
    case 'receivingTouchdowns':   return triHigh(v, 1, 0.5);
    case 'longReception':         return triHigh(v, 25, 15);
    case 'rushingYards':          return triHigh(v, 80, 45);
    case 'yardsPerRushAttempt':   return triHigh(v, 5, 3.5);
    case 'rushingTouchdowns':     return triHigh(v, 1, 0.5);
    case 'longRushing':           return triHigh(v, 20, 10);
    case 'passingYards':          return triHigh(v, 275, 200);
    case 'completionPct':         return triHigh(v, 68, 58);
    case 'passingTouchdowns':     return triHigh(v, 2, 1);
    case 'interceptions':         return triLow(v, 0, 1);   // thrown → lower is better
    case 'sacks':                 return triLow(v, 1, 3);   // taken → lower is better
    case 'fumbles': case 'fumblesLost': return triLow(v, 0, 1);
    case 'totalTackles':          return triHigh(v, 7, 4);
    case 'passesDefended':        return triHigh(v, 2, 1);
    default: return '';
  }
}
function espnNum(s) {
  const n = parseFloat(String(s == null ? '' : s).replace(/,/g, ''));
  return isNaN(n) ? null : n;
}

// Render one ESPN season into the same table shell the NFL gamelog uses, so the two tabs read
// identically — same frozen WK/OPP columns, same color grading, same totals row.
function renderEspnSeason(season, gl, league) {
  const labels = gl.labels || [], names = gl.names || [];
  if (!labels.length) return '';
  // Per-game stat arrays live under seasonTypes[].categories[].events[], keyed by event id;
  // the opponent/team metadata lives in a separate events{} map.
  const statsByEvent = {};
  (gl.seasonTypes || []).forEach(st => (st.categories || []).forEach(c => (c.events || []).forEach(ev => {
    statsByEvent[ev.eventId] = ev.stats;
  })));
  const events = gl.events || {};
  const teamMap = new Map();
  const rows = [];
  Object.keys(events).forEach(k => {
    const e = events[k];
    const stats = statsByEvent[e.id];
    if (!stats) return;
    const opp = e.opponent || {}, tm = e.team || {};
    if (tm.abbreviation) teamMap.set(tm.abbreviation, tm.logo || (tm.id ? NCAA_LOGO(tm.id) : ''));
    rows.push({
      week: e.week, date: e.gameDate, atVs: e.atVs || 'vs',
      oppAbbr: opp.abbreviation || '', oppLogo: opp.logo || (opp.id ? NCAA_LOGO(opp.id) : ''), stats,
    });
  });
  if (!rows.length) return '';
  rows.sort((a, b) => new Date(a.date || 0) - new Date(b.date || 0));

  const dispLabel = i => (names[i] === 'yardsPerReception' || names[i] === 'yardsPerRushAttempt') ? 'YPC' : labels[i];
  const grpOf = i => espnStatGroup(names[i]);
  let grpCells = '', colHead = '', gi = 0;
  while (gi < labels.length) {
    const g = grpOf(gi);
    let span = 1;
    while (gi + span < labels.length && grpOf(gi + span) === g) span++;
    grpCells += `<th class="pc-grp" colspan="${span}">${g === 'MISC' ? '' : g}</th><th></th>`;
    gi += span;
  }
  grpCells = grpCells.replace(/<th><\/th>$/, '');
  labels.forEach((l, i) => {
    colHead += ((i > 0 && grpOf(i) !== grpOf(i - 1)) ? '<th></th>' : '') + `<th>${esc(dispLabel(i))}</th>`;
  });
  const bodyRows = rows.map(r => {
    const cells = labels.map((l, i) => {
      const sep = (i > 0 && grpOf(i) !== grpOf(i - 1)) ? '<td></td>' : '';
      const v = r.stats[i];
      return sep + `<td class="pc-cell ${espnColor(names[i], espnNum(v))}">${(v == null || v === '') ? '–' : esc(v)}</td>`;
    }).join('');
    const oppTxt = r.oppAbbr
      ? `<span class="pc-opp-inner">${r.atVs === '@' ? '<span class="pc-at">@</span>' : '<span class="pc-vs">vs</span>'}` +
        `${r.oppLogo ? `<img src="${r.oppLogo}" class="pc-opp-logo" onerror="this.style.display='none'">` : ''}` +
        `<span>${esc(r.oppAbbr)}</span></span>`
      : '–';
    return `<tr><td class="pc-wk">${r.week != null ? r.week : ''}</td>` +
      `<td class="pc-opp ${r.atVs === '@' ? 'away' : 'home'}">${oppTxt}</td>${cells}</tr>`;
  }).join('');

  const totals = espnSeasonTotals(rows, names);
  let totalsRow = '';
  if (totals) {
    const tcells = labels.map((l, i) => {
      const sep = (i > 0 && grpOf(i) !== grpOf(i - 1)) ? '<td></td>' : '';
      return sep + `<td class="pc-cell pc-total-cell">${totals[i] == null ? '–' : esc(totals[i])}</td>`;
    }).join('');
    totalsRow = `<tr class="pc-total-row"><td class="pc-wk">TOT</td><td class="pc-opp">${rows.length}g</td>${tcells}</tr>`;
  }
  const teamTag = teamMap.size
    ? ` <span class="pc-season-team">· ${[...teamMap].map(([ab, lg]) =>
        `${lg ? `<img src="${lg}" class="pc-season-logo" onerror="this.style.display='none'">` : ''}${esc(ab)}`).join(' / ')}</span>`
    : '';
  const collegeTag = league === 'college-football' ? ` <span class="pc-college-tag">COLLEGE</span>` : '';
  return `<div class="pc-season">
    <div class="pc-season-title">${esc(season)}${collegeTag}${teamTag}</div>
    <div class="pc-table-scroll"><table class="pc-table">
      <thead>
        <tr><th></th><th></th>${grpCells}</tr>
        <tr><th class="pc-th-wk">WK</th><th>OPP</th>${colHead}</tr>
      </thead>
      <tbody>${bodyRows}${totalsRow}</tbody>
    </table></div>
  </div>`;
}
// Counting stats sum, "long" columns take the max, YPC/CMP% are recomputed from their summed
// components; every other rate is left blank rather than averaged into nonsense.
function espnSeasonTotals(rows, names) {
  if (!rows.length) return null;
  const n = names.length;
  const sum = new Array(n).fill(0), max = new Array(n).fill(null), seen = new Array(n).fill(false);
  const idxByName = {};
  names.forEach((nm, i) => { idxByName[nm] = i; });
  const isLong = nm => /^long/i.test(nm);
  const isRate = nm => /Pct$|yardsPer|Rating|QBR|avgGain|^avg/i.test(nm);
  rows.forEach(r => names.forEach((nm, i) => {
    const v = espnNum(r.stats[i]);
    if (v == null) return;
    seen[i] = true;
    if (isLong(nm)) max[i] = Math.max(max[i] == null ? -Infinity : max[i], v);
    else sum[i] += v;
  }));
  const out = new Array(n).fill(null);
  names.forEach((nm, i) => {
    if (!seen[i]) return;
    if (isLong(nm)) { out[i] = max[i] == null ? null : String(max[i]); return; }
    if (isRate(nm)) return;
    out[i] = Number.isInteger(sum[i]) ? String(sum[i]) : String(Math.round(sum[i] * 10) / 10);
  });
  const rec = (rateName, ydName, cntName, mult) => {
    if (idxByName[rateName] == null) return;
    const yd = idxByName[ydName] != null ? sum[idxByName[ydName]] : null;
    const ct = idxByName[cntName] != null ? sum[idxByName[cntName]] : null;
    if (yd != null && ct) out[idxByName[rateName]] = ((yd / ct) * (mult || 1)).toFixed(1);
  };
  rec('yardsPerReception', 'receivingYards', 'receptions');
  rec('yardsPerRushAttempt', 'rushingYards', 'rushingAttempts');
  rec('completionPct', 'completions', 'passingAttempts', 100);
  return out;
}

// Player card
// ═══════════════════════════════════════════════════════════════════════════
// Click any player anywhere in the app and this opens: who he is, where he was drafted, who
// rosters him in BAFL, and what he actually produced — week by week, season by season.
//
// TWO DESIGN CONSTRAINTS SHAPE EVERYTHING BELOW.
//
// 1. NO SEED. There is no pre-baked history file, so every season comes live from Sleeper's
//    per-player weekly endpoint, ONE SEASON PER REQUEST, and only when its tab is clicked.
//    The candidate season list is derived from `years_exp` (see eligibleSeasons) so the tabs
//    render instantly; a season that turns out to be empty greys itself out on first click,
//    which quietly corrects Sleeper's frequently-wrong years_exp.
//
// 2. BAFL SCORING, NOT FANTASY POINTS. This league is scored on five categories, so grading a
//    game on PPR points would be answering a question nobody here asks. The leading column
//    group is the player's BAFL CATEGORY CONTRIBUTION for that game — passing yards net of the
//    interception penalty, rush yards, receiving yards, total TDs, kicking points — graded
//    green/yellow/red against per-position, per-game benchmarks. The raw box score follows.
// ═══════════════════════════════════════════════════════════════════════════

// Which BAFL categories a position actually contributes to, and what a good game looks like
// in each.
//
// These per-game thresholds were re-derived from real positional data rather than guessed.
// For each position, take the per-game output of the LAST STARTABLE player at that position
// (rank N, where N is how many the league starts league-wide — see leagueStarterCount) and
// set green at ~1.15x that and yellow at ~0.75x. The originals were guesses and ran badly
// hot: "good" for a tight end was 60 receiving yards in a season where the NFL's best tight
// end averaged 72.9, so even an elite TE was mostly yellow.
//
// Anchors (2025, BAFL's 2QB/2RB/2WR/1TE/2K lineup):
//   QB passing 204/g · RB rushing 60/g · WR receiving 60/g · TE receiving 48/g · K 7.2/g
//                                    [category,   good≥,  ok≥ ]
const PC_CATS_BY_POS = {
  QB: [['passing', 235, 150], ['rushing', 30, 10],  ['tds', 2, 1]],
  RB: [['rushing', 70, 45],   ['receiving', 30, 12], ['tds', 1, 0.5]],
  WR: [['receiving', 70, 45], ['rushing', 15, 5],   ['tds', 1, 0.5]],
  TE: [['receiving', 55, 35], ['rushing', 15, 5],   ['tds', 1, 0.5]],
  K:  [['kicking', 8, 5]],
};
// Total-yardage benchmarks (the BAFL tiebreaker) per position, per game — same derivation.
const PC_TOTAL_BENCH = { QB: [255, 165], RB: [93, 60], WR: [70, 45], TE: [55, 35] };
const PC_CAT_LABEL = { passing: 'PASS', rushing: 'RUSH', receiving: 'REC', tds: 'TD', kicking: 'KICK' };
// Raw box-score columns per position, after the BAFL group. Each column is
// {key, label, grp, get(stats), color(v), fmt(v)}.
const PC_BOX_SCHEMA = {
  QB: {
    groups: ['PASSING', 'RUSHING'],
    cols: [
      { key: 'pass_att', label: 'ATT', grp: 0, color: v => triHigh(v, 35, 25) },
      { key: 'pass_cmp', label: 'CMP', grp: 0, color: v => triHigh(v, 24, 16) },
      { key: '_cmp_pct', label: 'PCT', grp: 0, fmt: v => v == null ? '–' : v.toFixed(1) + '%', color: v => triHigh(v, 68, 58) },
      { key: 'pass_yd',  label: 'YD',  grp: 0, color: v => triHigh(v, 275, 200) },
      { key: 'pass_td',  label: 'TD',  grp: 0, color: v => triHigh(v, 2, 1) },
      { key: 'pass_int', label: 'INT', grp: 0, color: v => triLow(v, 0, 1) },
      { key: 'pass_sack',label: 'SK',  grp: 0, color: v => triLow(v, 1, 3) },
      { key: 'rush_att', label: 'ATT', grp: 1, color: () => '' },
      { key: 'rush_yd',  label: 'YD',  grp: 1, color: v => triHigh(v, 40, 15) },
      { key: '_ru_ypc',  label: 'YPC', grp: 1, fmt: v => v == null ? '–' : v.toFixed(1), color: v => triHigh(v, 5, 3.5) },
      { key: 'rush_td',  label: 'TD',  grp: 1, color: v => triHigh(v, 1, 0.5) },
    ],
  },
  RB: {
    groups: ['RUSHING', 'RECEIVING'],
    cols: [
      { key: 'rush_att', label: 'ATT', grp: 0, color: () => '' },
      { key: 'rush_yd',  label: 'YD',  grp: 0, color: v => triHigh(v, 80, 45) },
      { key: '_ru_ypc',  label: 'YPC', grp: 0, fmt: v => v == null ? '–' : v.toFixed(1), color: v => triHigh(v, 4.5, 3.5) },
      { key: 'rush_lng', label: 'LNG', grp: 0, color: v => triHigh(v, 20, 10) },
      { key: 'rush_td',  label: 'TD',  grp: 0, color: v => triHigh(v, 1, 0.5) },
      { key: 'rec_tgt',  label: 'TAR', grp: 1, color: v => triHigh(v, 5, 3) },
      { key: 'rec',      label: 'REC', grp: 1, color: v => triHigh(v, 4, 2) },
      { key: 'rec_yd',   label: 'YD',  grp: 1, color: v => triHigh(v, 40, 20) },
      { key: 'rec_td',   label: 'TD',  grp: 1, color: v => triHigh(v, 1, 0.5) },
    ],
  },
  WR: {
    groups: ['RECEIVING', 'RUSHING'],
    cols: [
      { key: 'rec_tgt',  label: 'TAR', grp: 0, color: v => triHigh(v, 8, 5) },
      { key: 'rec',      label: 'REC', grp: 0, color: v => triHigh(v, 6, 4) },
      { key: 'rec_yd',   label: 'YD',  grp: 0, color: v => triHigh(v, 80, 50) },
      { key: '_re_ypc',  label: 'YPC', grp: 0, fmt: v => v == null ? '–' : v.toFixed(1), color: v => triHigh(v, 14, 10) },
      { key: 'rec_lng',  label: 'LNG', grp: 0, color: v => triHigh(v, 25, 15) },
      { key: 'rec_td',   label: 'TD',  grp: 0, color: v => triHigh(v, 1, 0.5) },
      { key: 'rush_att', label: 'ATT', grp: 1, color: () => '' },
      { key: 'rush_yd',  label: 'YD',  grp: 1, color: v => triHigh(v, 20, 8) },
      { key: 'rush_td',  label: 'TD',  grp: 1, color: v => triHigh(v, 1, 0.5) },
    ],
  },
  K: {
    groups: ['KICKING'],
    cols: [
      { key: 'fgm',      label: 'FGM', grp: 0, color: v => triHigh(v, 2, 1) },
      { key: 'fga',      label: 'FGA', grp: 0, color: () => '' },
      { key: 'fgm_lng',  label: 'LNG', grp: 0, color: v => triHigh(v, 50, 40) },
      { key: 'xpm',      label: 'XPM', grp: 0, color: () => '' },
      { key: 'xpa',      label: 'XPA', grp: 0, color: () => '' },
      { key: 'fgmiss',   label: 'MISS',grp: 0, color: v => triLow(v, 0, 1) },
    ],
  },
};
PC_BOX_SCHEMA.TE = PC_BOX_SCHEMA.WR;

// Positions with a hand-built box score. Anything else (defenders, punters) still gets a card
// — hero, draft, ownership, BAFL categories — it just falls back to the ESPN gamelog for the
// box score, which is data-driven and covers every position.
function pcHasSchema(pos) { return !!PC_BOX_SCHEMA[String(pos || '').toUpperCase()]; }
function pcCatsForPos(pos) { return PC_CATS_BY_POS[String(pos || '').toUpperCase()] || null; }

// ─── Card state ───────────────────────────────────────────────────────────
let PC = null;        // {pid, pos, team, mode, season, seasons, seasonState:{}} | null
let pcToken = 0;      // bumped per load, so a slow request can't overwrite a newer view

// ─── Open / close ─────────────────────────────────────────────────────────
async function openPlayerCard(pid) {
  pid = String(pid || '');
  if (!pid) return;
  if (!S.playersCache) {
    // The card can't render a hero without the player record; load it, then re-enter.
    try { await loadPlayers(); }
    catch { toast('Player data still loading — try again in a moment', 'err'); return; }
  }
  const p = playerRec(pid);
  if (!p) { toast('No player record found', 'err'); return; }

  // Positions with neither a BAFL category mapping nor a hand-built box score (defenders,
  // punters) have nothing to render from Sleeper's weekly feed — route their NFL tab to ESPN.
  const espnOnly = !pcHasSchema(p.pos) && !pcCatsForPos(p.pos);
  PC = { pid, pos: p.pos || '', team: p.team || '', mode: 'nfl', season: null, seasons: [], seasonState: {}, espnOnly };
  pcLockPage(true);
  renderPcShell(pid, p);

  loadPcDraft(pid);
  if (espnOnly) { renderPcSeasonTabs(); loadPcEspn('nfl'); return; }

  const seasons = await eligibleSeasons(pid);
  if (!PC || PC.pid !== pid) return;   // closed or switched while resolving the season list
  PC.seasons = seasons;
  seasons.forEach(s => { PC.seasonState[s] = 'unknown'; });
  renderPcSeasonTabs();
  pcSelectSeason(seasons[0], { autoAdvance: true });
}

function closePlayerCard() {
  PC = null;
  pcToken++;
  const el = document.getElementById('pcOverlay');
  if (el) el.remove();
  // A card is often opened FROM the roster modal, which stays open behind it. Releasing the
  // scroll lock unconditionally would let the page scroll under a modal that's still up.
  const rosterOpen = document.getElementById('rosterOverlay')?.classList.contains('active');
  if (!rosterOpen) pcLockPage(false);
}

// While the card is open the page behind it must not scroll. Setting body.overflow alone
// isn't enough on iOS — the browser will still run pull-to-refresh from the backdrop — so the
// lock goes on <html> as a class and the CSS pairs it with overscroll-behavior:contain.
function pcLockPage(on) {
  try { document.documentElement.classList.toggle('pc-locked', !!on); } catch { /* no-op */ }
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && PC) closePlayerCard(); });

// ─── Shell ────────────────────────────────────────────────────────────────
function renderPcShell(pid, p) {
  const name = p.name || 'Player';
  const pos = (p.pos || '').toUpperCase();
  const tm = (p.team || '').toUpperCase();
  const age = p.age != null ? (Number.isInteger(p.age) ? p.age : Math.round(p.age * 10) / 10) : '–';
  const exp = p.years_exp != null ? (p.years_exp === 0 ? 'R' : p.years_exp) : '–';
  const jersey = (p.number != null && p.number !== '') ? `#${p.number}` : '';
  // A few club primaries (PIT gold, NO gold) are light enough that white hero text vanishes
  // on them — darken those rather than special-casing the text color.
  let tc = teamColor(tm);
  if (hexLum(tc) > 0.4) tc = darkenHex(tc, 0.45);
  const heroStyle = tm ? `background:linear-gradient(135deg, ${tc} 0%, ${tc} 42%, var(--surface) 100%);` : '';

  const meta = (label, val) =>
    `<div class="pc-meta-item"><span class="pc-meta-label">${label}</span>` +
    `<span class="pc-meta-val${(val == null || val === '–' || val === '') ? ' pc-meta-empty' : ''}">${esc(val == null || val === '' ? '–' : val)}</span></div>`;

  const html = `
    <div class="pc" onclick="event.stopPropagation()">
      <div class="pc-hero" style="${heroStyle}">
        <div class="pc-hero-logo" style="${tm ? `background-image:url('${NFL_LOGO(tm)}')` : ''}"></div>
        ${headshotImg(pid, p, 'pc-hero-img', (name[0] || '?'))}
        <div class="pc-hero-main">
          <div class="pc-name">${esc(name)}${jersey ? `<span class="pc-jersey">${esc(jersey)}</span>` : ''}</div>
          <div class="pc-sub">
            ${pos ? `<span class="pos-badge pos-${esc(pos)}">${esc(pos)}</span>` : ''}
            ${tm ? `<span class="pc-team">${esc(teamDisplayName(tm))}</span>` : ''}
          </div>
          <div class="pc-meta">
            ${meta('AGE', age)}${meta('HT', fmtHeight(p.height))}
            ${meta('WT', p.weight ? `${p.weight} lbs` : '–')}
            ${meta('EXP', exp)}${meta('COLLEGE', p.college || '–')}
          </div>
          <div class="pc-hero-draft" id="pcHeroDraft"></div>
        </div>
        <button class="pc-close" onclick="closePlayerCard()" aria-label="Close">✕</button>
      </div>
      ${pcOwnerBandHTML(pid)}
      <div class="pc-tabs" id="pcTabs"></div>
      <div class="pc-seasons" id="pcSeasons"></div>
      <div class="pc-body" id="pcBody"><div class="pc-loading">Loading game logs…</div></div>
    </div>`;

  let overlay = document.getElementById('pcOverlay');
  if (overlay) { overlay.innerHTML = html; }
  else {
    overlay = document.createElement('div');
    overlay.id = 'pcOverlay';
    overlay.className = 'pc-overlay';
    overlay.onclick = closePlayerCard;
    overlay.innerHTML = html;
    document.body.appendChild(overlay);
  }
  attachPcSwipe(overlay.querySelector('.pc'));
