<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAFL — Bad Ass Football League</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏈</text></svg>">
<meta name="theme-color" content="#0d1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1117;--surface:#161b22;--surface2:#1c2330;--surface3:#212936;
  --border:#2d3748;--border2:#374151;
  --accent:#3d9bff;
  --text:#e6edf3;--muted:#7d8590;
  --success:#3fb950;--warn:#d29922;--danger:#f85149;
  --qb:#ff4d6a;--rb:#00cf9f;--wr:#56a5ff;--te:#ffc94d;--k:#a855f7;
  --font:'Inter','SF Pro Display',system-ui,sans-serif;
  --mono:'JetBrains Mono','SF Mono','Fira Code',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{max-width:100%;overflow-x:hidden;}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;font-size:14px;}

/* ── Horizontal scroll container ─────────────────────────────────────────────
   The page is overflow-x:hidden so a single too-wide child can't make the whole document pan
   sideways on touch. That guard has a sharp edge: anything genuinely wider than the viewport
   is CLIPPED and unreachable rather than scrollable. So every wide thing — tables, brackets,
   game logs — goes inside one of these instead, and scrolls within its own bounds.

   `border-collapse:separate;border-spacing:0` on the tables inside is REQUIRED, not cosmetic:
   under `collapse` a cell's borders belong to the table rather than the cell, so a sticky
   (frozen) column's borders smear or vanish while scrolling. With zero spacing the layout is
   pixel-identical to collapse. */
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;}
.table-scroll table{border-collapse:separate;border-spacing:0;}

/* ── Page-scroll lock ────────────────────────────────────────────────────────
   Applied to <html> while any overlay is open. Setting body{overflow:hidden} alone is not
   enough on iOS: the backdrop still runs pull-to-refresh and rubber-band scroll behind the
   overlay. Locking the root element and pairing it with overscroll-behavior on the overlay
   itself is what actually stops both. overflow:hidden does not reset scrollTop, so the page
   is exactly where it was when the overlay closes. */
html.pc-locked,html.pc-locked body{overflow:hidden;height:100%;overscroll-behavior:none;}

/* ── Toast ── */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(14px);
  background:var(--surface2);border:1px solid var(--border);border-radius:9px;
  padding:9px 15px;font-size:12.5px;font-weight:700;color:var(--text);
  box-shadow:0 10px 34px rgba(0,0,0,.5);z-index:900;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:calc(100vw - 32px);}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── Segmented control (Teams / Players) ── */
.seg{display:inline-flex;gap:2px;background:var(--surface2);border:1px solid var(--border);
  border-radius:7px;padding:2px;margin-left:auto;flex:none;}
.seg-btn{background:none;border:none;color:var(--muted);font-family:var(--font);
  font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
  padding:4px 10px;border-radius:5px;cursor:pointer;transition:all .13s;white-space:nowrap;}
.seg-btn:hover{color:var(--text);}
.seg-btn.active{background:var(--accent);color:#08121f;}

/* ── Headshot fallback placeholder ───────────────────────────────────────────
   Revealed by imgFallback() only once every source URL in the chain has 404'd, so a player
   with no photo anywhere still reads as a person rather than a broken image. */
.hs-err{display:none;align-items:center;justify-content:center;
  background:var(--surface3);border:1px solid var(--border);
  font-weight:900;color:var(--muted);flex:none;}

/* ── Icon button ── */
.btn-icon{background:var(--surface2);border:1px solid var(--border);color:var(--muted);
  border-radius:6px;width:28px;height:26px;font-size:12px;cursor:pointer;transition:all .15s;
  display:inline-flex;align-items:center;justify-content:center;flex:none;line-height:1;}
.btn-icon:hover{border-color:var(--accent);color:var(--accent);}
/* ── Header ── */
.header{background:var(--surface);border-bottom:1px solid var(--border);
  padding:9px 18px;display:flex;align-items:center;gap:12px;
  position:sticky;top:0;z-index:200;flex-wrap:wrap;}
.logo{font-size:17px;font-weight:900;color:var(--accent);letter-spacing:-.5px;
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;}
.logo span{color:var(--text);}
.season-tag{font-size:11px;font-weight:700;color:var(--muted);
  background:var(--surface2);border:1px solid var(--border);
  padding:3px 9px;border-radius:5px;white-space:nowrap;}
.week-nav{display:flex;align-items:center;gap:6px;margin-left:auto;}
.week-nav button{background:var(--surface2);border:1px solid var(--border);
  color:var(--text);border-radius:6px;padding:4px 11px;font-size:13px;
  font-weight:800;cursor:pointer;transition:all .15s;line-height:1;}
.week-nav button:hover{border-color:var(--accent);color:var(--accent);}
.week-nav button:disabled{opacity:.35;cursor:not-allowed;pointer-events:none;}
.week-label{font-size:13px;font-weight:800;color:var(--text);
  min-width:90px;text-align:center;white-space:nowrap;}
.dh-dot{display:inline-block;width:7px;height:7px;border-radius:50%;
  background:var(--warn);margin-left:5px;vertical-align:middle;
  box-shadow:0 0 5px var(--warn);}
.hdr-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.btn-refresh{background:var(--accent);border:none;color:#000;
  border-radius:6px;padding:5px 12px;font-size:11px;font-weight:800;cursor:pointer;transition:all .15s;}
.btn-refresh:hover{background:#5aadff;}
.btn-refresh:disabled{opacity:.5;cursor:not-allowed;}
.updated-tag{font-size:10px;color:var(--muted);white-space:nowrap;}

/* ── Tabs ── */
.tabs{background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 18px;display:flex;gap:0;overflow-x:auto;}
.tab{padding:10px 18px;font-size:12px;font-weight:700;cursor:pointer;border:none;
  background:none;color:var(--muted);border-bottom:2px solid transparent;
  transition:all .15s;white-space:nowrap;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}

/* ── Content ── */
.page{max-width:1240px;margin:0 auto;padding:22px 18px 60px;}

/* ── Section heading ── */
.sec-head{font-size:10px;font-weight:800;color:var(--muted);letter-spacing:1.2px;
  text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:10px;}
.sec-head::after{content:'';flex:1;height:1px;background:var(--border);order:1;}
/* The divider is a ::after, so it is always the LAST child. Ordering pulls it back in front of
   any control appended to the heading, giving: label — rule — control. */
.sec-head .seg{order:2;}
.sec-spacer{margin-top:30px;}
.dh-badge{font-size:9px;font-weight:900;color:var(--warn);
  background:rgba(210,153,34,.15);border:1px solid rgba(210,153,34,.3);
  padding:2px 7px;border-radius:4px;letter-spacing:.5px;}

.sec-note{font-weight:400;text-transform:none;letter-spacing:0;font-size:10px;color:var(--muted);}
/* ── Matchup grid ── */
.matchups-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:14px;}

/* ── Matchup card ────────────────────────────────────────────────────────────
   Team names live in a flex header ABOVE the table, not as <th> cells inside it. When they
   were table cells, one row had to fit score + name + "Categories" + name + score across the
   viewport — which overflowed a 360px phone and, because the page clips horizontal overflow,
   put the right-hand score somewhere you could never scroll to. Out here the names ellipsis
   independently and the table is left with five narrow columns that fit anywhere. */
.mc{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.mc-head{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--surface2);
  border-bottom:1px solid var(--border);}
.mc-side{display:flex;align-items:center;gap:8px;flex:1;min-width:0;}
.mc-side-r{justify-content:flex-end;}
.mc-team{font-size:13px;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mc-score{font-family:var(--mono);font-size:21px;font-weight:900;line-height:1;flex:none;
  min-width:22px;text-align:center;}
.mc-score.win{color:var(--success);}
.mc-score.loss{color:var(--muted);}
.mc-score.tie{color:var(--warn);}
.mc-vs{font-size:9px;font-weight:800;color:var(--muted);letter-spacing:1px;
  text-transform:uppercase;flex:none;padding:0 2px;}

.mc-table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;}
.mc-tbl{width:100%;border-collapse:separate;border-spacing:0;}
.mc-tbl tr{border-top:1px solid var(--border);}
.mc-tbl tbody tr:hover{background:var(--surface2);}
.mc-tbl td{border-top:1px solid var(--border);}
.mc-chk{width:26px;min-width:26px;text-align:center;padding:7px 2px;}
.mc-tick{color:var(--success);font-size:15px;font-weight:900;}
.mc-pchk{color:var(--accent);font-size:12px;font-weight:900;opacity:.85;}
.mc-val{text-align:left;font-family:var(--mono);font-size:13px;font-weight:700;
  padding:7px 10px;min-width:56px;white-space:nowrap;}
.mc-val-r{text-align:right;}
/* The projected-finish line sits under each live value rather than beside it, so adding
   projections costs the card no horizontal room at all. */
.mc-proj{display:block;font-size:9.5px;font-weight:700;color:var(--accent);opacity:.8;
  letter-spacing:.2px;margin-top:1px;}
.mc-cat{text-align:center;font-size:11.5px;color:var(--muted);font-weight:600;
  padding:7px 6px;white-space:nowrap;
  /* Frozen so a long category label can never push the values out of reach on a small screen. */
  position:sticky;left:0;background:var(--surface);z-index:1;}
.mc-tbl tbody tr:hover .mc-cat{background:var(--surface2);}
.mc-total{background:rgba(255,255,255,.025);}
.mc-total td{border-top:2px solid var(--border)!important;}
.mc-total .mc-cat{color:var(--text);font-weight:800;background:#1a2029;}
.mc-total .mc-val{color:var(--text);font-weight:800;}
/* ── Standings ───────────────────────────────────────────────────────────────
   The wrapper used to be overflow:hidden, which silently clipped the right-hand columns on a
   phone — a long Sleeper display name was enough to push PF/PA off an edge you couldn't
   scroll to. Now the wrapper only clips its rounded corners vertically, and the table scrolls
   inside .table-scroll with RANK and TEAM frozen. */
.standings-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;
  overflow:hidden;}
.stbl{width:100%;border-collapse:separate;border-spacing:0;}
.stbl th{background:var(--surface2);padding:9px 14px;font-size:9.5px;font-weight:800;
  color:var(--muted);letter-spacing:.6px;text-transform:uppercase;border-bottom:1px solid var(--border);
  white-space:nowrap;}
.stbl td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;}
.stbl tbody tr:last-child td{border-bottom:none;}
.stbl tbody tr:hover td{background:var(--surface2);}
.stbl .s-rank{font-family:var(--mono);font-weight:800;color:var(--muted);width:56px;white-space:nowrap;}
.stbl .s-team{font-weight:700;max-width:180px;}
/* Truncate rather than widen. Without this a long display name grows the whole table and
   pushes every stat column sideways. */
.stbl .s-team .team-link{display:inline-block;max-width:100%;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom;}
.stbl .s-rec{font-family:var(--mono);font-weight:800;width:74px;white-space:nowrap;}
.stbl .s-num{font-family:var(--mono);font-weight:700;text-align:right;color:var(--muted);white-space:nowrap;}
.stbl .s-pf{color:var(--text);}
.stbl th.r{text-align:right;}
.stbl tr.playoff-divider td{border-top:2px solid var(--accent);}
.divider-lbl{font-size:9px;font-weight:800;color:var(--accent);letter-spacing:.5px;
  background:rgba(61,155,255,.12);padding:1px 6px;border-radius:4px;margin-left:6px;
  white-space:nowrap;}
.rec-w{color:var(--success);}
.rec-l{color:var(--muted);}

/* Frozen identity columns. Each needs its own opaque background or the scrolling cells show
   through; the widths are fixed so TEAM's left offset is exact rather than guessed. */
.stbl th:nth-child(1),.stbl td:nth-child(1){position:sticky;left:0;z-index:2;
  background:var(--surface);width:56px;min-width:56px;}
.stbl th:nth-child(2),.stbl td:nth-child(2){position:sticky;left:56px;z-index:2;
  background:var(--surface);box-shadow:1px 0 0 var(--border);}
.stbl thead th{z-index:3;}
.stbl thead th:nth-child(1),.stbl thead th:nth-child(2){background:var(--surface2);z-index:4;}
.stbl tbody tr:hover td:nth-child(1),.stbl tbody tr:hover td:nth-child(2){background:var(--surface2);}

/* ── Category heat map ───────────────────────────────────────────────────────
   Season category totals, shaded by league rank rather than by absolute value — the useful
   comparison in a category league is always relative to the other nine teams. */
.s-cat{font-family:var(--mono);font-weight:700;text-align:right;font-size:12px;white-space:nowrap;}
.s-cat-h{font-size:9px!important;letter-spacing:.4px!important;}
.hm1{background:rgba(63,185,80,.22);color:#8ff0a6;}
.hm2{background:rgba(63,185,80,.10);color:#bfe6c8;}
.hm3{background:transparent;color:var(--muted);}
.hm4{background:rgba(248,81,73,.09);color:#e8b7b4;}
.hm5{background:rgba(248,81,73,.20);color:#ffa9a4;}
.stbl tbody tr:hover .s-cat{filter:brightness(1.18);}

.heat-legend{display:flex;align-items:center;gap:4px;margin-top:10px;
  font-size:9.5px;color:var(--muted);flex-wrap:wrap;}
.heat-legend-lbl{margin-right:5px;font-weight:700;letter-spacing:.3px;}
.heat-legend span:not(.heat-legend-lbl){display:inline-flex;align-items:center;justify-content:center;
  min-width:34px;height:16px;border-radius:4px;font-size:8.5px;font-weight:800;padding:0 5px;}
/* ── Leaders ── */
/* minmax(0,...) not minmax(310px,...): a grid item's default min-width is `auto`, i.e. its
   content, so a card holding a nowrap value like "3,437 yds" refuses to shrink and pushes the
   whole track past the viewport. The explicit 0 minimum lets the ellipsis rules inside actually
   take effect. */
.leaders-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(310px,100%),1fr));gap:14px;}
.lcard{min-width:0;}
.lcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 15px;}
.lcard-title{font-size:10px;font-weight:800;color:var(--accent);text-transform:uppercase;
  letter-spacing:.7px;margin-bottom:11px;}
.lrow{display:flex;align-items:center;gap:9px;padding:6px 0;
  border-bottom:1px solid rgba(255,255,255,.04);font-size:12.5px;min-width:0;}
.lrow:last-child{border-bottom:none;}
.lrow-empty{color:var(--muted);font-size:11px;font-style:italic;justify-content:center;padding:10px 0;}
.lrank{font-family:var(--mono);font-size:11px;font-weight:800;color:var(--muted);width:16px;flex:none;}
.lrank.r1{color:#f4c04a;}
.lrank.r2{color:#c0c0c0;}
.lrank.r3{color:#cd7f32;}
.lname{flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.lval{font-family:var(--mono);font-weight:800;color:var(--accent);font-size:13px;
  white-space:nowrap;flex:none;}
.leaders-note{font-size:10.5px;color:var(--muted);margin:-4px 0 14px;line-height:1.45;max-width:70ch;}

/* Player rows carry a headshot, position badge and BAFL owner, and open the player card. */
.lrow-player{cursor:pointer;border-radius:7px;padding:6px 5px;margin:0 -5px;transition:background .12s;}
.lrow-player:hover{background:var(--surface2);}
.lhs{width:26px;height:26px;border-radius:50%;object-fit:cover;object-position:top center;
  background:var(--surface3);border:1px solid var(--border);flex:none;}
.lhs-err{width:26px;height:26px;border-radius:50%;font-size:10px;}
.lname-block{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.lsub{display:flex;align-items:center;gap:5px;font-size:9.5px;color:var(--muted);min-width:0;}
.lowner{font-weight:700;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.lgames{font-family:var(--mono);font-weight:700;opacity:.75;flex:none;margin-left:auto;}
/* ── Loading / Error ── */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:70px 20px;color:var(--muted);gap:14px;}
.spin{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);
  border-radius:50%;animation:spin .75s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-label{font-size:13px;color:var(--muted);}
.loading-sub{font-size:11px;color:var(--muted);opacity:.7;}
.error-box{padding:30px 20px;text-align:center;color:var(--danger);font-size:13px;}
.empty-box{padding:50px 20px;text-align:center;color:var(--muted);font-size:13px;}

/* ── Position badges ── */
.pos-badge{font-size:9px;font-weight:900;padding:2px 6px;border-radius:4px;
  letter-spacing:.4px;flex:none;white-space:nowrap;}
.pos-QB{background:rgba(255,77,106,.18);color:var(--qb);}
.pos-RB{background:rgba(0,207,159,.18);color:var(--rb);}
.pos-WR{background:rgba(86,165,255,.18);color:var(--wr);}
.pos-TE{background:rgba(255,201,77,.18);color:var(--te);}
.pos-K{background:rgba(168,85,247,.18);color:var(--k);}
.pos-DEF,.pos-DB,.pos-DL,.pos-LB,.pos-OL,.pos-S{background:rgba(185,138,99,.18);color:#b98a63;}

/* ── Team name link ── */
.team-link{cursor:pointer;border-bottom:1px dotted rgba(255,255,255,.2);transition:color .12s;}
.team-link:hover{color:var(--accent);border-bottom-color:var(--accent);}

/* ── Roster modal ── */
.roster-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:500;
  display:none;align-items:flex-start;justify-content:center;
  overflow-y:auto;padding:24px 14px;backdrop-filter:blur(3px);}
.roster-overlay.active{display:flex;}
.roster-modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  width:min(480px,100%);overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 24px 70px rgba(0,0,0,.55);animation:modalIn .18s ease;}
@keyframes modalIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.roster-modal-head{padding:14px 16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;background:var(--surface2);flex:none;}
.roster-modal-title{font-size:16px;font-weight:900;flex:1;}
.roster-modal-close{background:var(--surface3);border:1px solid var(--border);
  color:var(--muted);border-radius:8px;width:30px;height:30px;font-size:15px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;}
.roster-modal-close:hover{color:var(--text);border-color:var(--accent);}
.roster-modal-body{overflow-y:auto;padding:8px 12px 16px;max-height:calc(100vh - 160px);}
.roster-sec-head{font-size:9.5px;font-weight:800;color:var(--muted);
  letter-spacing:1px;text-transform:uppercase;padding:10px 4px 5px;
  border-bottom:1px solid var(--border);margin-bottom:4px;}
.roster-sec-head:first-child{padding-top:4px;}
.roster-player{display:flex;align-items:center;gap:10px;padding:6px 8px;
  border-radius:8px;transition:background .1s;}
.roster-player:hover{background:var(--surface2);}
.roster-player.starter{background:rgba(61,155,255,.06);}
.roster-player.starter:hover{background:rgba(61,155,255,.12);}
.roster-hs{width:36px;height:36px;border-radius:50%;object-fit:cover;object-position:top;
  background:var(--surface3);border:1px solid var(--border);flex:none;}
.roster-hs-err{width:36px;height:36px;border-radius:50%;font-size:11px;}
.roster-player-info{flex:1;min-width:0;}
.roster-player-name{display:block;font-size:13px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.roster-player-team{font-size:10.5px;color:var(--muted);font-weight:600;}
.roster-starter-tag{font-size:8px;font-weight:800;color:var(--accent);
  background:rgba(61,155,255,.14);border:1px solid rgba(61,155,255,.3);
  padding:1px 5px;border-radius:4px;letter-spacing:.3px;flex:none;}
.roster-player-stats{font-size:10px;color:var(--accent);font-family:var(--mono);
  font-weight:600;margin-left:5px;opacity:.85;}


/* Every row opens that player's card. */
.roster-player.clickable{cursor:pointer;}
.roster-player.clickable:active{background:var(--surface3);}
.roster-player.clickable .roster-player-name{text-decoration:underline;
  text-decoration-color:transparent;text-underline-offset:2px;transition:text-decoration-color .12s;}
.roster-player.clickable:hover .roster-player-name{text-decoration-color:var(--muted);}

/* ── Starting-lineup category summary ────────────────────────────────────────
   The five numbers the matchup is actually decided on, shown above the individual lines that
   sum to them — so the modal answers "why am I losing Rushing" rather than only "who's in". */
.lineup-cat-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;
  padding:8px 4px 10px;}
.lcs-chip{background:var(--surface2);border:1px solid var(--border);border-radius:8px;
  padding:6px 7px;display:flex;flex-direction:column;gap:2px;min-width:0;}
.lcs-lbl{font-size:8px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
  color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lcs-val{font-family:var(--mono);font-size:14px;font-weight:900;color:var(--text);line-height:1;}
.lcs-total{border-color:rgba(61,155,255,.35);background:rgba(61,155,255,.08);}
.lcs-total .lcs-val{color:var(--accent);}
/* ═══ Player card ═══════════════════════════════════════════════════════════ */
.pc-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:900;
  display:flex;align-items:flex-start;justify-content:center;
  overflow-y:auto;padding:20px 12px;backdrop-filter:blur(3px);
  /* Stops the drag from chaining out to the page behind once the card hits its scroll end. */
  overscroll-behavior:contain;}
.pc{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  width:min(760px,100%);display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 24px 70px rgba(0,0,0,.6);animation:pcIn .18s ease;
  max-height:calc(100vh - 40px);}
@keyframes pcIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

/* ── Hero ── */
.pc-hero{position:relative;flex:none;padding:16px 16px 13px;display:flex;gap:13px;align-items:center;
  background:var(--surface2);overflow:hidden;
  /* The swipe-to-close drag starts here, so the browser must not claim the gesture first. */
  touch-action:none;}
.pc-hero-logo{position:absolute;right:-12px;top:50%;transform:translateY(-50%);
  width:130px;height:130px;background-size:contain;background-repeat:no-repeat;
  background-position:center;opacity:.13;pointer-events:none;}
.pc-hero-img{width:72px;height:72px;border-radius:12px;object-fit:cover;object-position:top center;
  background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.14);flex:none;position:relative;z-index:1;}
.pc-hero-img-err{width:72px;height:72px;border-radius:12px;font-size:26px;position:relative;z-index:1;}
.pc-hero-main{flex:1;min-width:0;position:relative;z-index:1;}
.pc-name{font-size:19px;font-weight:900;color:#fff;letter-spacing:-.3px;line-height:1.15;
  display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;}
.pc-jersey{font-family:var(--mono);font-size:12px;font-weight:800;color:rgba(255,255,255,.6);}
.pc-sub{display:flex;align-items:center;gap:7px;margin-top:5px;flex-wrap:wrap;}
.pc-team{font-size:11.5px;font-weight:700;color:rgba(255,255,255,.8);}
.pc-meta{display:flex;gap:14px;margin-top:9px;flex-wrap:wrap;}
.pc-meta-item{display:flex;flex-direction:column;gap:1px;min-width:0;}
.pc-meta-label{font-size:7.5px;font-weight:800;letter-spacing:.9px;color:rgba(255,255,255,.5);
  text-transform:uppercase;}
.pc-meta-val{font-size:11.5px;font-weight:800;color:#fff;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:120px;}
.pc-meta-empty{color:rgba(255,255,255,.4);font-weight:600;}
.pc-close{position:absolute;top:9px;right:9px;z-index:3;
  background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.18);color:#fff;
  border-radius:8px;width:28px;height:28px;font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;}
.pc-close:hover{background:rgba(0,0,0,.55);}

/* ── Draft line ── */
.pc-hero-draft{margin-top:8px;min-height:1px;}
.pc-draft-line{display:inline-flex;align-items:center;gap:7px;font-size:10.5px;font-weight:700;
  color:#fff;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.14);
  border-radius:6px;padding:3px 8px;flex-wrap:wrap;}
.pc-draft-line .muted{color:rgba(255,255,255,.65);font-weight:600;}
.pc-draft-lbl{font-size:7.5px;font-weight:900;letter-spacing:1px;color:rgba(255,255,255,.55);}
.pc-draft-logo{width:14px;height:14px;object-fit:contain;vertical-align:middle;}
.pc-draft-team{display:inline-flex;align-items:center;gap:4px;}

/* ── BAFL ownership band ── */
.pc-owner{display:flex;align-items:center;gap:9px;padding:7px 16px;flex:none;
  background:rgba(61,155,255,.08);border-bottom:1px solid var(--border);}
.pc-owner-lbl{font-size:8px;font-weight:900;letter-spacing:1.1px;color:var(--accent);
  text-transform:uppercase;flex:none;}
.pc-owner-name{font-size:12.5px;font-weight:800;color:var(--text);min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pc-owner-fa{background:rgba(125,133,144,.08);}
.pc-owner-fa .pc-owner-lbl{color:var(--muted);}
.pc-owner-fa .pc-owner-name{color:var(--muted);font-weight:700;}

/* ── Source tabs (NFL / College) ── */
.pc-tabs{display:flex;gap:4px;padding:9px 14px 0;flex:none;}
.pc-tab{background:var(--surface2);border:1px solid var(--border);color:var(--muted);
  border-radius:7px 7px 0 0;padding:6px 13px;font-size:11px;font-weight:800;cursor:pointer;
  font-family:var(--font);transition:all .13s;white-space:nowrap;}
.pc-tab:hover{color:var(--text);}
.pc-tab.active{background:var(--surface3);color:var(--accent);border-color:var(--accent);border-bottom-color:transparent;}

/* ── Season pills ────────────────────────────────────────────────────────────
   The seedless core of the card: one pill per candidate season, each an independent lazy load
   from Sleeper. A season proven to have no games is DISABLED rather than removed, so the row
   never reflows out from under a finger mid-tap. */
.pc-seasons{display:flex;gap:5px;padding:9px 14px 0;flex:none;
  overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.pc-seasons::-webkit-scrollbar{display:none;}
.pc-season-pill{background:var(--surface2);border:1px solid var(--border);color:var(--muted);
  border-radius:999px;padding:4px 12px;font-size:11px;font-weight:800;font-family:var(--mono);
  cursor:pointer;transition:all .13s;flex:none;white-space:nowrap;}
.pc-season-pill:hover:not(:disabled){border-color:var(--accent);color:var(--text);}
.pc-season-pill.active{background:var(--accent);border-color:var(--accent);color:#08121f;}
.pc-season-pill.empty{opacity:.3;cursor:not-allowed;text-decoration:line-through;}
.pc-season-pill.loading{border-color:var(--accent);color:var(--accent);
  animation:pcPillPulse 1s ease-in-out infinite;}
@keyframes pcPillPulse{0%,100%{opacity:1}50%{opacity:.45}}

/* ── Body ── */
.pc-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:10px 14px 16px;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.pc-loading,.pc-empty{padding:34px 16px;text-align:center;color:var(--muted);font-size:12.5px;}
.pc-retry-wrap{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;}
.pc-retry-btn{height:25px;padding:0 11px;border-radius:999px;border:1px solid var(--border);
  background:var(--surface2);color:var(--text);font-size:11px;font-weight:700;cursor:pointer;
  font-family:var(--font);}
.pc-retry-btn:hover{border-color:var(--accent);color:var(--accent);}
.pc-src{font-size:9.5px;color:var(--muted);text-align:center;padding:12px 0 2px;}

/* ── Season table ── */
.pc-season{margin-bottom:14px;}
.pc-season-title{font-size:13px;font-weight:800;color:var(--text);margin:4px 2px 7px;
  display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.pc-season-team{font-size:11px;font-weight:700;color:var(--muted);display:inline-flex;
  align-items:center;gap:4px;}
.pc-season-logo{width:14px;height:14px;object-fit:contain;vertical-align:middle;margin-right:2px;}
.pc-college-tag{font-size:8px;font-weight:900;letter-spacing:.7px;color:var(--warn);
  background:rgba(210,153,34,.15);border:1px solid rgba(210,153,34,.3);
  border-radius:4px;padding:1px 6px;}
.pc-badge{font-size:8.5px;font-weight:900;letter-spacing:.4px;border-radius:5px;padding:2px 7px;
  border:1px solid var(--border);background:var(--surface2);color:var(--muted);cursor:help;}
.pc-badge-ypg{color:var(--accent);border-color:rgba(61,155,255,.3);background:rgba(61,155,255,.1);}
.pc-cons-A{color:#8ff0a6;border-color:rgba(63,185,80,.4);background:rgba(63,185,80,.15);}
.pc-cons-B{color:#bfe6c8;border-color:rgba(63,185,80,.25);background:rgba(63,185,80,.08);}
.pc-cons-C{color:#ffd98a;border-color:rgba(210,153,34,.3);background:rgba(210,153,34,.12);}
.pc-cons-D{color:#e8b7b4;border-color:rgba(248,81,73,.25);background:rgba(248,81,73,.09);}
.pc-cons-F{color:#ffa9a4;border-color:rgba(248,81,73,.4);background:rgba(248,81,73,.16);}

.pc-table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;}
.pc-table{border-collapse:separate;border-spacing:0;font-size:11px;width:100%;}
.pc-table th{font-size:8.5px;font-weight:800;color:var(--muted);letter-spacing:.03em;
  padding:2px 4px;text-align:center;white-space:nowrap;background:var(--surface);}
.pc-table th.pc-grp{color:var(--text);font-size:9px;border-bottom:1px solid var(--border);padding-bottom:3px;}
.pc-grp-bafl{color:var(--accent)!important;border-bottom-color:var(--accent)!important;}
.pc-th-wk{text-align:left!important;}
.pc-table td{padding:3px 3px;}
/* Freeze WK and OPP so the game stays identified while the stats scroll right. Requires the
   separate border model — see the note in 00-base.css. */
.pc-table th:nth-child(1),.pc-table td:nth-child(1){position:sticky;left:0;z-index:2;
  background:var(--surface);min-width:38px;width:38px;}
.pc-table th:nth-child(2),.pc-table td:nth-child(2){position:sticky;left:38px;z-index:2;
  background:var(--surface);min-width:56px;box-shadow:1px 0 0 var(--border);}
.pc-table thead th{z-index:4;}
.pc-table thead th:nth-child(1),.pc-table thead th:nth-child(2){z-index:5;}
.pc-table thead tr:last-child th{box-shadow:0 1px 0 var(--border);}

.pc-cell{padding:6px 7px;text-align:center;border-radius:6px;font-weight:700;font-family:var(--mono);
  background:var(--surface3);white-space:nowrap;min-width:34px;}
.pc-cell.g{background:rgba(0,207,159,.22);color:#8effdf;}
.pc-cell.y{background:rgba(255,201,77,.20);color:#ffd98a;}
.pc-cell.r{background:rgba(255,90,90,.20);color:#ff9d9d;}
.pc-cell.bye{background:var(--surface2);color:var(--muted);font-weight:600;}
/* The BAFL category cells lead the row and carry slightly more weight than the box score
   behind them — they are the numbers this league is decided on. */
.pc-cat-cell{font-size:12px;font-weight:800;}
.pc-tot-cell{box-shadow:inset -2px 0 0 rgba(61,155,255,.25);}
.pc-wk{font-weight:800;color:var(--muted);text-align:left;padding-left:5px!important;white-space:nowrap;}
.pc-opp{font-weight:800;text-align:center;white-space:nowrap;padding:0 6px!important;font-size:10.5px;}
.pc-opp.home{color:var(--text);} .pc-opp.away{color:var(--muted);}
.pc-opp-inner{display:inline-flex;align-items:center;gap:3px;}
.pc-opp-logo{width:14px;height:14px;object-fit:contain;}
.pc-at,.pc-vs{font-size:8.5px;font-weight:800;color:var(--muted);}
.pc-row-bye .pc-opp,.pc-row-dnp .pc-opp{color:var(--muted);font-size:9.5px;}
.pc-started{color:var(--accent);font-size:8px;margin-left:3px;vertical-align:super;}
.pc-total-row .pc-wk{color:var(--accent);font-weight:900;}
.pc-total-row .pc-opp{color:var(--muted);font-weight:700;font-size:9.5px;}
.pc-total-cell{background:var(--surface2)!important;color:var(--text)!important;
  font-weight:800;border-top:2px solid var(--border);}
.pc-empty-sub{font-size:10.5px;color:var(--muted);opacity:.75;margin-top:6px;
  max-width:44ch;margin-left:auto;margin-right:auto;line-height:1.5;}
/* ── Player search ── */
.ps-overlay{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:950;
  display:flex;align-items:flex-start;justify-content:center;padding:60px 14px 20px;
  backdrop-filter:blur(3px);overscroll-behavior:contain;}
.ps-modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  width:min(480px,100%);display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 24px 70px rgba(0,0,0,.6);max-height:calc(100vh - 90px);}
.ps-head{display:flex;align-items:center;gap:8px;padding:10px 12px;flex:none;
  background:var(--surface2);border-bottom:1px solid var(--border);}
.ps-ico{font-size:13px;flex:none;opacity:.7;}
.ps-input{flex:1;min-width:0;background:var(--surface3);border:1px solid var(--border);
  border-radius:8px;color:var(--text);font-family:var(--font);font-size:13.5px;font-weight:600;
  padding:7px 10px;outline:none;}
.ps-input:focus{border-color:var(--accent);}
.ps-toggle{background:var(--surface3);border:1px solid var(--border);color:var(--muted);
  border-radius:7px;padding:6px 9px;font-size:9.5px;font-weight:900;letter-spacing:.5px;
  cursor:pointer;font-family:var(--font);flex:none;transition:all .13s;}
.ps-toggle:hover{color:var(--text);border-color:var(--accent);}
.ps-toggle.on{background:rgba(61,155,255,.15);border-color:var(--accent);color:var(--accent);}
.ps-close{background:var(--surface3);border:1px solid var(--border);color:var(--muted);
  border-radius:7px;width:28px;height:28px;font-size:13px;cursor:pointer;flex:none;
  display:flex;align-items:center;justify-content:center;}
.ps-close:hover{color:var(--text);border-color:var(--accent);}
.ps-results{overflow-y:auto;padding:6px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.ps-empty{padding:34px 14px;text-align:center;color:var(--muted);font-size:12.5px;}
.ps-row{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:9px;
  cursor:pointer;transition:background .1s;min-width:0;}
.ps-row:hover{background:var(--surface2);}
.ps-hs{width:32px;height:32px;border-radius:50%;object-fit:cover;object-position:top center;
  background:var(--surface3);border:1px solid var(--border);flex:none;}
.ps-hs-err{width:32px;height:32px;border-radius:50%;font-size:11px;}
.ps-name-block{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;}
.ps-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ps-team{font-size:10px;color:var(--muted);font-weight:600;}
.ps-owner{font-size:9.5px;font-weight:800;color:var(--accent);
  background:rgba(61,155,255,.12);border:1px solid rgba(61,155,255,.28);
  border-radius:5px;padding:2px 7px;flex:none;max-width:38%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ps-owner.ps-fa{color:var(--muted);background:var(--surface2);border-color:var(--border);}
.ps-more{padding:9px 10px 4px;text-align:center;font-size:10px;color:var(--muted);}
/* ── Live matchup projections ── */
.proj-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:6px 12px;background:rgba(61,155,255,.07);
  border-bottom:1px solid rgba(61,155,255,.18);}
.proj-lbl{font-size:8.5px;font-weight:900;letter-spacing:1px;color:var(--accent);
  text-transform:uppercase;flex:none;}
.proj-score{font-family:var(--mono);font-size:13px;font-weight:900;color:var(--text);flex:none;}
.proj-dash{color:var(--muted);margin:0 2px;font-weight:700;}
.proj-swing{font-size:10px;font-weight:700;color:var(--warn);
  background:rgba(210,153,34,.12);border:1px solid rgba(210,153,34,.28);
  border-radius:5px;padding:1px 7px;margin-left:auto;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:100%;}
/* ── Playoff bracket ── */
.playoff-wrap{display:flex;flex-direction:column;gap:32px;}
.playoff-section-title{font-size:15px;font-weight:900;display:flex;align-items:center;gap:10px;
  margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--border);}
.bkt-scroll{overflow-x:auto;padding-bottom:10px;-webkit-overflow-scrolling:touch;}
.bkt-grid{display:inline-flex;gap:0;align-items:center;min-width:max-content;}
.bkt-col{display:flex;flex-direction:column;}
.bkt-col-lbl{font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;
  letter-spacing:.9px;text-align:center;padding:0 8px 10px;white-space:nowrap;}
.bkt-pair{position:relative;display:flex;flex-direction:column;
  gap:3px;padding-right:22px;margin:6px 0;}
.bkt-pair::after{content:'';position:absolute;right:11px;
  top:22px;bottom:22px;
  border-right:2px solid var(--border);
  border-top:2px solid var(--border);
  border-bottom:2px solid var(--border);}
.bkt-pair::before{content:'';position:absolute;right:0;top:50%;
  width:11px;height:2px;background:var(--border);transform:translateY(-50%);}
.bkt-single{position:relative;padding-right:22px;margin:6px 0;}
.bkt-single::before{content:'';position:absolute;right:0;top:50%;
  width:22px;height:2px;background:var(--border);transform:translateY(-50%);}
.bkt-bye-row{height:52px;display:flex;align-items:center;padding:0 10px;
  font-size:10px;color:var(--muted);font-style:italic;min-width:180px;}
.bkt-slot{display:flex;align-items:center;gap:7px;padding:7px 10px;
  background:var(--surface);border:1px solid var(--border);border-radius:7px;
  min-width:180px;cursor:pointer;transition:border-color .12s;}
.bkt-slot:hover{border-color:var(--accent);}
.bkt-slot.bw{border-color:var(--success);background:rgba(63,185,80,.07);}
.bkt-slot.bl{opacity:.4;}
.bkt-slot.tbd{border-style:dashed;}
.bkt-seed{font-size:10px;font-weight:800;color:var(--muted);min-width:18px;flex:none;}
.bkt-name{flex:1;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bkt-score{font-family:var(--mono);font-size:15px;font-weight:900;flex:none;}
.bkt-score.sw{color:var(--success);} .bkt-score.st{color:var(--warn);}
.bkt-champ-col{padding:0 20px;display:flex;align-items:center;justify-content:center;}
.bkt-champ-card{border:2px solid var(--success);border-radius:12px;padding:14px 18px;
  text-align:center;min-width:140px;
  background:linear-gradient(135deg,rgba(63,185,80,.12),rgba(61,155,255,.08));}
.bkt-champ-icon{font-size:30px;display:block;margin-bottom:4px;}
.bkt-champ-lbl{font-size:9px;font-weight:800;letter-spacing:.8px;color:var(--success);
  text-transform:uppercase;margin-bottom:5px;}
.bkt-champ-name{font-size:14px;font-weight:900;color:var(--text);}
.bkt-champ-seed{font-size:10px;color:var(--muted);margin-top:2px;}

/* ── Season selector ── */.season-sel{background:var(--surface2);border:1px solid var(--border);color:var(--text);
  border-radius:6px;padding:4px 8px;font-size:11px;font-weight:700;cursor:pointer;
  font-family:var(--font);max-width:130px;}
.season-sel:hover{border-color:var(--accent);}
.season-sel:disabled{opacity:.4;cursor:not-allowed;}
.season-sel option{background:var(--surface2);color:var(--text);}
.past-season-note{font-size:10px;color:var(--warn);background:rgba(210,153,34,.1);
  border:1px solid rgba(210,153,34,.25);border-radius:6px;padding:6px 11px;
  margin-bottom:14px;display:flex;align-items:center;gap:6px;}

/* ── Auto-refresh ── */
.ar-wrap{display:flex;align-items:center;gap:6px;}
.ar-toggle{background:var(--surface2);border:1px solid var(--border);color:var(--muted);
  border-radius:6px;padding:4px 9px;font-size:11px;font-weight:700;cursor:pointer;
  transition:all .15s;white-space:nowrap;}
.ar-toggle:hover{border-color:var(--accent);color:var(--text);}
.ar-toggle.ar-on{border-color:var(--success);color:var(--success);background:rgba(63,185,80,.1);}
.ar-countdown{font-size:10px;color:var(--muted);font-family:var(--mono);white-space:nowrap;
  min-width:36px;text-align:right;}

/* ── Mobile / responsive ─────────────────────────────────────────────────────
   The page itself never scrolls sideways (see 00-base.css). Everything wide instead lives in
   its own .table-scroll / .pc-table-scroll / .mc-table-scroll / .bkt-scroll container, so on a
   phone content is reachable by scrolling THAT element rather than being clipped by the page
   guard — which is what used to happen to the standings' stat columns and the matchup card's
   right-hand score. */
.page,.page>*{min-width:0;max-width:100%;}

@media(max-width:760px){
  .matchups-grid{grid-template-columns:1fr;}
  .leaders-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
  .header{padding:8px 10px;gap:7px;}
  .page{padding:14px 12px 50px;}
  .week-label{min-width:64px;font-size:12px;}
  .tabs{padding:0 10px;}
  .tab{padding:10px 14px;}

  /* Matchup card: names now sit in their own flex header, so they get the full row width and
     simply ellipsis instead of forcing the table wide. */
  .mc-head{padding:9px 10px;gap:6px;}
  .mc-team{font-size:12px;}
  .mc-score{font-size:18px;min-width:18px;}
  .mc-val{padding:7px 8px;font-size:12px;min-width:50px;}
  .mc-cat{font-size:11px;padding:7px 5px;}
  .mc-chk{width:22px;min-width:22px;}
  .proj-bar{padding:5px 10px;gap:6px;}
  .proj-swing{margin-left:0;width:100%;}

  /* Standings: tighter padding, and the frozen TEAM column gets a hard cap so the category
     grid has room to scroll beside it rather than being pushed off entirely. */
  .stbl th,.stbl td{padding:8px 9px;}
  .stbl .s-rank{width:44px;}
  .stbl th:nth-child(1),.stbl td:nth-child(1){width:44px;min-width:44px;}
  .stbl th:nth-child(2),.stbl td:nth-child(2){left:44px;}
  .stbl .s-team{max-width:112px;}
  .divider-lbl{display:none;}
  .s-cat{font-size:11px;}

  /* Player card fills the screen as a sheet, which is also what makes swipe-to-close read as
     the natural dismissal. */
  .pc-overlay{padding:0;align-items:flex-end;}
  .pc{max-height:94vh;border-radius:16px 16px 0 0;width:100%;}
  .pc-hero{padding:14px 13px 12px;gap:11px;}
  .pc-hero-img,.pc-hero-img-err{width:60px;height:60px;}
  .pc-name{font-size:16.5px;}
  .pc-meta{gap:11px;margin-top:8px;}
  .pc-meta-val{font-size:11px;max-width:88px;}
  .pc-body{padding:9px 10px 18px;}
  .pc-tabs,.pc-seasons{padding-left:10px;padding-right:10px;}
  .lineup-cat-summary{grid-template-columns:repeat(2,minmax(0,1fr));}

  .ps-overlay{padding:0;align-items:flex-end;}
  .ps-modal{width:100%;border-radius:14px 14px 0 0;max-height:88vh;}
}

/* Two columns of player rows — headshot, name, owner, value — is too cramped to read below
   this, so the player view drops to one column earlier than the team view needs to. */
@media(max-width:560px){
  .leaders-grid{grid-template-columns:1fr;}
}
@media(max-width:420px){
  .page{padding:11px 9px 44px;}
  .logo{font-size:15px;}
  .updated-tag{display:none;}          /* the ↻ countdown already says how fresh this is */
  .ar-toggle{padding:4px 7px;}
  .mc-val{min-width:44px;padding:7px 6px;}
  .lineup-cat-summary{grid-template-columns:repeat(2,minmax(0,1fr));}
}

/* Landscape phones are short, not narrow — give the sheets back their vertical room. */
@media(max-height:520px){
  .pc{max-height:98vh;}
  .ps-modal{max-height:96vh;}
  .ps-overlay{padding-top:10px;}
}
</style>
</head>
<body>

<div class="header">
  <div class="logo">🏈 <span>BAFL</span></div>
  <select id="seasonSel" class="season-sel" onchange="switchSeason(this.value)" disabled>
    <option>Loading…</option>
  </select>
  <div class="week-nav">
    <button id="btnPrev" onclick="changeWeek(-1)" disabled>‹</button>
    <span class="week-label" id="weekLabel">—</span>
    <button id="btnNext" onclick="changeWeek(1)" disabled>›</button>
  </div>
  <div class="hdr-right">
    <button class="btn-icon" id="btnSearch" onclick="openPlayerSearch()"
            title="Search players — see who rosters anyone" aria-label="Search players">🔍</button>
    <div class="ar-wrap">
      <button class="ar-toggle" id="btnAR" onclick="toggleAutoRefresh()" title="Auto-refresh every 5 min">↻ Auto</button>
      <span class="ar-countdown" id="arCountdown"></span>
    </div>
    <button class="btn-refresh" id="btnRefresh" onclick="refresh()" disabled>Refresh</button>
    <span class="updated-tag" id="updatedTag"></span>
  </div>
</div>

<div class="tabs">
  <button class="tab active" data-tab="matchups" onclick="setTab(this)">Matchups</button>
  <button class="tab" data-tab="standings" onclick="setTab(this)">Standings</button>
  <button class="tab" data-tab="leaders" onclick="setTab(this)">Leaders</button>
  <button class="tab" data-tab="playoffs" onclick="setTab(this)">Playoffs</button>
</div>

<div class="page" id="page">
  <div class="loading"><div class="spin"></div><div class="loading-label">Loading league data…</div></div>
</div>

<!-- Roster popup modal -->
<div class="roster-overlay" id="rosterOverlay" onclick="closeRosterModal()">
  <div class="roster-modal" onclick="event.stopPropagation()">
    <div class="roster-modal-head">
      <span class="roster-modal-title" id="rosterModalTitle"></span>
      <button class="roster-modal-close" onclick="closeRosterModal()">✕</button>
    </div>
    <div class="roster-modal-body" id="rosterModalBody"></div>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';
// ─── Config ───────────────────────────────────────────────────────────────
const ROOT_LEAGUE_ID       = '1389348066355609601';
const API                  = 'https://api.sleeper.app/v1';
// api.sleeper.com (no /v1) is the newer host carrying per-player weekly stats and weekly
// projections. Both are public, read-only and CORS-open, same as the /v1 endpoints.
const API2                 = 'https://api.sleeper.com';
const AR_INTERVAL_MS       = 5 * 60 * 1000;  // auto-refresh every 5 min
const REGULAR_SEASON_WEEKS = 14;              // weeks 1–14 are regular season
const DH_WEEKS             = [2, 3, 13, 14];  // weeks that have a double header
const PLAYOFF_CUTOFF       = 4;              // top 4 teams make playoffs

// ─── Sleeper endpoints ────────────────────────────────────────────────────
const SLEEPER_PLAYERS_URL    = `${API}/players/nfl`;
const SLEEPER_STATE_URL      = `${API}/state/nfl`;
// One player's whole season, week by week. This is what makes the player card work without a
// pre-baked seed: one request per player-season, fetched only when that season tab is opened.
const SLEEPER_WEEKLY_URL     = (pid, season) =>
  `${API2}/stats/nfl/player/${pid}?season_type=regular&season=${season}&grouping=week`;
// Projections for one week — the basis of the live matchup projections. Filtered to the five
// positions BAFL actually rosters: unfiltered this response is ~9,400 rows / 625KB gzipped,
// and the filter cuts it to ~3,300 rows / 230KB. Nothing outside these positions can ever
// appear in a BAFL starting lineup, so the rest is pure download cost.
const BAFL_POSITIONS = ['QB', 'RB', 'WR', 'TE', 'K'];
const SLEEPER_WEEK_PROJ_URL  = (season, week) =>
  `${API2}/projections/nfl/${season}/${week}?season_type=regular`
  + BAFL_POSITIONS.map(p => `&position[]=${p}`).join('');

// Sleeper's weekly stats thin out badly before this; don't offer season tabs we can't fill.
const EARLIEST_STAT_SEASON = 2009;

// ─── State ────────────────────────────────────────────────────────────────
const S = {
  seasons: [],       // [{id, season, name, league}] newest-first
  seasonIdx: 0,
  league: null,
  users: [],
  rosters: [],
  userMap:   {},
  rosterMap: {},
  currentWeek: 1,
  selectedWeek: 1,
  activeTab: 'matchups',
  weekCache: {},     // `${leagueId}:${week}` → {matchups, stats}
  schedCache: {},    // `${leagueId}:sched:${week}` → [matchup,...] (structure only)
  dhMatchups: null,  // null = not computed; {2:[{r1,r2}],...} when computed
  dhHistory: {},     // exact DH data keyed by season year, loaded from double_headers.json
  allLoadedFor: '',
  playersCache: null,   // slimmed player dict: pid → {name, pos, team, …}
  playersPromise: null, // in-flight load, so concurrent callers share one fetch
  ownerByPid: null,     // pid → roster_id, rebuilt per season (drives "who rosters him?")
  nflSeason: null,      // current NFL season year, from Sleeper's state endpoint
  weeklyCache: {},      // `${season}:${pid}` → raw weekly json (player card)
  projCache: {},        // `${season}:${week}` → pid → projected stats
  seasonStarted: false, // false when league is pre_draft / not yet scheduled
  arEnabled: true,
  arTimer: null,
  arCountTimer: null,
  arNextAt: null,
};

// Convenience: ID of the league currently in view
function lid() { return S.seasons[S.seasonIdx]?.id || ROOT_LEAGUE_ID; }
function isCurrentSeason() { return S.seasonIdx === 0; }
// ─── NFL reference constants ──────────────────────────────────────────────
// Fixed lookup tables (32 teams, never changes mid-season) plus the CDN URL builders the
// player card and roster views use for logos and headshots. Keeping these as literals means
// no extra network round-trip and no CORS surface — they're pure string builders.

const NFL_LOGO = t => `https://static.www.nfl.com/t_headshot_desktop/f_auto/league/api/clubs/logos/${t === 'JAX' ? 'JAC' : t}`;
const SLEEPER_HEADSHOT = pid => `https://sleepercdn.com/content/nfl/players/${pid}.jpg`;
const SLEEPER_HEADSHOT_THUMB = pid => `https://sleepercdn.com/content/nfl/players/thumb/${pid}.jpg`;
// ESPN athlete headshot — the fallback when Sleeper has no photo (common for rookies and
// recent signings). league = 'nfl' | 'college-football'.
const ESPN_HEADSHOT = (league, id) => `https://a.espncdn.com/i/headshots/${league}/players/full/${id}.png`;
const NCAA_LOGO = id => `https://a.espncdn.com/i/teamlogos/ncaa/500/${id}.png`;

// Primary club colors, used to tint the player-card hero.
const TEAM_COLORS = {
  ARI:'#97233F', ATL:'#A71930', BAL:'#241773', BUF:'#00338D', CAR:'#0085CA',
  CHI:'#0B162A', CIN:'#FB4F14', CLE:'#311D00', DAL:'#003594', DEN:'#FB4F14',
  DET:'#0076B6', GB:'#203731',  HOU:'#03202F', IND:'#002C5F', JAX:'#006778',
  KC:'#E31837',  LAC:'#0080C6', LAR:'#003594', LV:'#000000',  MIA:'#008E97',
  MIN:'#4F2683', NE:'#002244',  NO:'#D3BC8D',  NYG:'#0B2265', NYJ:'#125740',
  PHI:'#004C54', PIT:'#FFB612', SEA:'#002244', SF:'#AA0000',  TB:'#D50A0A',
  TEN:'#0C2340', WAS:'#5A1414',
};
const TEAM_NAMES = {
  ARI:'Arizona Cardinals', ATL:'Atlanta Falcons', BAL:'Baltimore Ravens', BUF:'Buffalo Bills',
  CAR:'Carolina Panthers', CHI:'Chicago Bears', CIN:'Cincinnati Bengals', CLE:'Cleveland Browns',
  DAL:'Dallas Cowboys', DEN:'Denver Broncos', DET:'Detroit Lions', GB:'Green Bay Packers',
  HOU:'Houston Texans', IND:'Indianapolis Colts', JAX:'Jacksonville Jaguars', KC:'Kansas City Chiefs',
  LAC:'Los Angeles Chargers', LAR:'Los Angeles Rams', LV:'Las Vegas Raiders', MIA:'Miami Dolphins',
  MIN:'Minnesota Vikings', NE:'New England Patriots', NO:'New Orleans Saints', NYG:'New York Giants',
  NYJ:'New York Jets', PHI:'Philadelphia Eagles', PIT:'Pittsburgh Steelers', SEA:'Seattle Seahawks',
  SF:'San Francisco 49ers', TB:'Tampa Bay Buccaneers', TEN:'Tennessee Titans', WAS:'Washington Commanders',
};
function teamColor(t){ return TEAM_COLORS[String(t || '').toUpperCase()] || '#2b2f3a'; }
function teamDisplayName(code){ return TEAM_NAMES[String(code || '').toUpperCase()] || code || ''; }

// Relative luminance (0..1) of a hex color, for choosing readable text over it.
function hexLum(hex){
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
  if (!m) return 0;
  const n = parseInt(m[1], 16), r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const f = c => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
  return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b);
}
// Mix a hex color toward black by `amt` (0..1) — a few club primaries (PIT gold, NO gold) are
// light enough that white hero text on them is unreadable.
function darkenHex(hex, amt){
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
  if (!m) return hex;
  const n = parseInt(m[1], 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  r = Math.round(r * (1 - amt)); g = Math.round(g * (1 - amt)); b = Math.round(b * (1 - amt));
  return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
}

// Height comes off Sleeper as total inches ("76") or occasionally pre-formatted. Render 6'4".
function fmtHeight(h){
  if (h == null || h === '') return '–';
  const s = String(h).trim();
  if (s.includes("'")) return s;
  const inches = parseInt(s, 10);
  if (isNaN(inches) || inches <= 0) return '–';
  return `${Math.floor(inches / 12)}'${inches % 12}"`;
}
// ─── Helpers ──────────────────────────────────────────────────────────────
async function fetchJ(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}: ${url}`);
  return r.json();
}

// Same as fetchJ but resolves to `fallback` instead of throwing. Used for the optional
// enrichment calls (ESPN draft info, projections) where a failure should quietly degrade the
// view rather than blow up the render that requested it.
async function fetchSoft(url, fallback = null) {
  try { return await fetchJ(url); } catch { return fallback; }
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
// Escape for use inside a double-quoted HTML attribute (title=, aria-label=).
function escAttr(s) { return esc(s).replace(/'/g, '&#39;'); }
// Escape for a single-quoted JS string argument inside an onclick="" attribute.
function jsArg(s) {
  return "'" + String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;') + "'";
}
function fmtPts(v) {
  return v % 1 === 0 ? String(v) : v.toFixed(1);
}
// Round to a fixed number of decimals but drop a trailing ".0" — keeps stat cells narrow.
function fmtNum(v, dp = 0) {
  if (v == null || !Number.isFinite(Number(v))) return '–';
  const n = Number(v);
  return Number.isInteger(n) ? String(n) : n.toFixed(dp);
}

// ─── Toast ────────────────────────────────────────────────────────────────
// A transient status line, so background failures (a player DB that won't load, a season with
// no data) can report themselves without wiping out whatever the user is looking at.
function toast(msg, type = '') {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.style.borderColor = type === 'ok' ? 'var(--success)'
                       : type === 'err' ? 'var(--danger)' : 'var(--border)';
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2800);
}

// ─── Image fallback chain ─────────────────────────────────────────────────
// Headshot sources fail constantly — Sleeper has no photo for most rookies, ESPN 404s for
// players it hasn't ingested. Rather than one URL and a blank circle, every <img> carries a
// pipe-separated `data-fallbacks` list and walks it on error, hiding only once exhausted.
function imgFallback(img) {
  const list = (img.dataset.fallbacks || '').split('|').filter(Boolean);
  if (list.length) {
    img.dataset.fallbacks = list.slice(1).join('|');
    img.src = list[0];
  } else {
    img.onerror = null;
    img.style.visibility = 'hidden';
    const sib = img.nextElementSibling;
    if (sib && sib.classList.contains('hs-err')) sib.style.display = 'flex';
  }
}
// Build the ordered headshot URL list for a player: Sleeper first (best coverage for actives),
// then ESPN NFL, then ESPN college (which is where recent draftees actually have a photo).
function headshotPack(pid, p) {
  const urls = [];
  const add = u => { const s = String(u || '').trim(); if (s && !urls.includes(s)) urls.push(s); };
  if (pid) add(SLEEPER_HEADSHOT_THUMB(pid));
  const aid = p && p.espn_id ? String(p.espn_id) : '';
  if (aid) { add(ESPN_HEADSHOT('nfl', aid)); add(ESPN_HEADSHOT('college-football', aid)); }
  return { src: urls[0] || '', fallbacks: urls.slice(1) };
}
// <img> with the fallback chain wired up, plus an initials placeholder that reveals itself
// once every source has failed.
function headshotImg(pid, p, cls, placeholder) {
  const pack = headshotPack(pid, p);
  const ph = `<div class="hs-err ${cls}-err">${esc(placeholder || '?')}</div>`;
  if (!pack.src) return ph.replace('class="hs-err', 'style="display:flex" class="hs-err');
  return `<img class="${cls}" src="${pack.src}" alt="" loading="lazy" decoding="async"
    data-fallbacks="${pack.fallbacks.join('|')}" onerror="imgFallback(this)">${ph}`;
}

// ─── Stat grading ─────────────────────────────────────────────────────────
// Every graded stat cell in the app resolves to one of three classes — 'g' (good), 'y' (ok),
// 'r' (poor) — or '' for "don't grade this". Thresholds are per-GAME values, so the same
// function grades a weekly row and a per-game average identically.
function triHigh(v, goodAt, okAt) {   // higher is better
  if (v == null || !Number.isFinite(Number(v))) return '';
  const n = Number(v);
  return n >= goodAt ? 'g' : n >= okAt ? 'y' : 'r';
}
function triLow(v, goodBelow, okBelow) {   // lower is better (INTs thrown, sacks taken)
  if (v == null || !Number.isFinite(Number(v))) return '';
  const n = Number(v);
  return n <= goodBelow ? 'g' : n <= okBelow ? 'y' : 'r';
}

// 1 → "1st", 2 → "2nd", 22 → "22nd".
function ordinal(n) {
  if (n == null) return '';
  const s = n % 100;
  const suff = (s >= 11 && s <= 13) ? 'th' : (n % 10 === 1) ? 'st' : (n % 10 === 2) ? 'nd' : (n % 10 === 3) ? 'rd' : 'th';
  return n + suff;
}
// ─── Season chain ────────────────────────────────────────────────────────
// Walk previous_league_id to discover all past BAFL seasons.
// Each fetch gets a hard 4-second timeout so a slow/hung API call
// never blocks the entire app from loading.
async function fetchWithTimeout(url, ms = 4000) {
  const ctrl = new AbortController();
  const t    = setTimeout(() => ctrl.abort(), ms);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    clearTimeout(t);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  } catch(e) {
    clearTimeout(t);
    throw e;
  }
}

async function walkSeasonChain() {
  const chain = [];
  let id = ROOT_LEAGUE_ID;
  while (id && chain.length < 10) {   // cap at 10 seasons as a safety net
    try {
      const lg = await fetchWithTimeout(`${API}/league/${id}`);
      chain.push({ id, season: lg.season, name: lg.name, league: lg });
      id = lg.previous_league_id || null;
    } catch { break; }
  }
  return chain; // newest first
}

function buildSeasonPicker(seasons) {
  const sel = document.getElementById('seasonSel');
  sel.innerHTML = seasons.map((s, i) =>
    `<option value="${i}">${s.season} Season${i === 0 ? ' ★' : ''}</option>`
  ).join('');
  sel.disabled = seasons.length <= 1;
}

// ─── Bootstrap ────────────────────────────────────────────────────────────
async function init() {
  try {
    setLoading('Loading league data…');
    const [seasons, dhHistory] = await Promise.all([
      walkSeasonChain(),
      fetchJ('./double_headers.json').catch(() => ({})),
    ]);
    S.seasons   = seasons;
    S.dhHistory = dhHistory || {};
    buildSeasonPicker(seasons);
    // Warm the NFL player database in the background. It's needed by the player card, search
    // and player leaders, and after the first visit it comes straight out of Cache Storage —
    // starting it here means those views are usually instant instead of waiting on a download.
    loadPlayers().catch(() => { /* surfaced when a view that needs it is opened */ });
    currentNflSeason();
    await loadSeason(0);
  } catch(e) {
    setError('Failed to load league: ' + e.message);
  }
}

// Load a season by index, wiring up all state
async function loadSeason(idx) {
  S.seasonIdx    = idx;
  S.allLoadedFor = '';
  S.dhMatchups   = null;  // recompute for each season
  S.schedCache   = {};    // clear schedule cache for new season
  S.projCache    = {};    // projections are week+season specific
  const { id, league } = S.seasons[idx];
  S.league = league;

  const [users, rosters] = await Promise.all([
    fetchJ(`${API}/league/${id}/users`),
    fetchJ(`${API}/league/${id}/rosters`),
  ]);
  S.users = users;  S.rosters = rosters;
  S.userMap = {};   S.rosterMap = {};
  for (const u of users)   S.userMap[u.user_id]     = u.display_name;
  for (const r of rosters) S.rosterMap[r.roster_id] = S.userMap[r.owner_id] || `Team ${r.roster_id}`;
  buildOwnerIndex();   // pid → roster_id, so a card or search hit can name its BAFL owner

  const leg = parseInt(league.settings?.leg || 0);
  // Detect whether the season has started: status 'in_season', 'post_season',
  // or 'complete' all mean the schedule exists. Pre-draft / drafting = not started.
  const status = (league.status || '').toLowerCase();
  S.seasonStarted = !['pre_draft', 'drafting', ''].includes(status) && leg > 0;
  S.currentWeek   = S.seasonStarted ? Math.max(1, leg) : 1;
  S.selectedWeek  = S.currentWeek;

  document.getElementById('seasonSel').value    = String(idx);
  document.getElementById('seasonSel').disabled = false;
  document.getElementById('btnRefresh').disabled = false;
  updateWeekDisplay();
  stopAutoRefresh();
  await renderTab();
  scheduleAutoRefresh();
}

// ─── Season switching ─────────────────────────────────────────────────────
async function switchSeason(idxStr) {
  const idx = parseInt(idxStr);
  if (idx === S.seasonIdx) return;
  stopAutoRefresh();
  setLoading(`Loading ${S.seasons[idx].season} season…`);
  await loadSeason(idx);
}

// ─── Auto-refresh ─────────────────────────────────────────────────────────
// Active only when: current season, current week, matchups tab, page visible.
function shouldAutoRefresh() {
  return S.arEnabled
      && isCurrentSeason()
      && S.selectedWeek === S.currentWeek
      && S.activeTab === 'matchups'
      && !document.hidden;
}

function scheduleAutoRefresh() {
  stopAutoRefresh();
  if (!shouldAutoRefresh()) { updateARUI(); return; }
  S.arNextAt     = Date.now() + AR_INTERVAL_MS;
  S.arTimer      = setTimeout(async () => {
    if (!shouldAutoRefresh()) { scheduleAutoRefresh(); return; }
    delete S.weekCache[`${lid()}:${S.selectedWeek}`];
    await renderMatchups();
    document.getElementById('updatedTag').textContent = `Updated ${new Date().toLocaleTimeString()}`;
    scheduleAutoRefresh();
  }, AR_INTERVAL_MS);
  S.arCountTimer = setInterval(updateARCountdown, 1000);
  updateARUI();
}

function stopAutoRefresh() {
  if (S.arTimer)      { clearTimeout(S.arTimer);      S.arTimer      = null; }

  updateARUI();

}

function updateARCountdown() {
  if (!S.arNextAt) return;
  const rem = Math.max(0, Math.round((S.arNextAt - Date.now()) / 1000));
  const m = Math.floor(rem / 60), s = rem % 60;
  document.getElementById('arCountdown').textContent = `${m}:${String(s).padStart(2,'0')}`;
}

function updateARUI() {
  const btn   = document.getElementById('btnAR');
  const cntEl = document.getElementById('arCountdown');
